# ==========================================================
# Finora - Docker Compose
#
# Complete Local Development Application Stack
#
# Database:
#   External PostgreSQL
#
# Local development:
#   Backend + Web run locally in Docker
#   Database remains cloud hosted (Neon PostgreSQL)
#
# ==========================================================

services:

  # ========================================================
  # FastAPI Backend
  # ========================================================

  backend:

    build:
      context: ./backend
      dockerfile: Dockerfile

      # ----------------------------------------------------
      # Backend Build Arguments
      # ----------------------------------------------------
      #
      # APP_VERSION is passed into backend/Dockerfile:
      #
      #   ARG APP_VERSION=vdev
      #
      # Release pipeline:
      #
      #   Git tag:    v1.0.5
      #   APP_VERSION=1.0.5
      #
      # Dockerfile then embeds:
      #
      #   ENV APP_VERSION=1.0.5
      #
      # ----------------------------------------------------

      args:
        APP_VERSION: ${APP_VERSION:-vdev}

    container_name: finora-backend
    restart: unless-stopped


    # ------------------------------------------------------
    # Backend Environment
    # ------------------------------------------------------

    env_file:
      - ./backend/.env

    environment:
      DEBUG: ${DEBUG:-true}

      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-["http://localhost","http://localhost:80"]}

      # Runtime application version.
      #
      # Keep this aligned with the Docker build argument.
      #
      APP_VERSION: ${APP_VERSION:-vdev}


    # ------------------------------------------------------
    # Backend Source Mount
    # ------------------------------------------------------

    volumes:
      - ./backend:/backend
      - /backend/.venv
      - backend_logs:/backend/logs


    # ------------------------------------------------------
    # Backend HTTP Port
    # ------------------------------------------------------

    ports:
      - "8000:8000"


    # ------------------------------------------------------
    # Backend Health Check
    # ------------------------------------------------------

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -f http://localhost:8000/api/v1/health || exit 1"
        ]

      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s


    # ------------------------------------------------------
    # Internal Network
    # ------------------------------------------------------

    networks:
      - finora_network


  # ========================================================
  # Web
  #
  # React Production Build + Nginx
  # ========================================================

  web:

    build:
      context: .
      dockerfile: infrastructure/web/Dockerfile

      # ----------------------------------------------------
      # Frontend Build Arguments
      # ----------------------------------------------------
      #
      # Vite variables are embedded during npm build.
      #
      # These remain unchanged so the existing frontend
      # workflow continues to work.
      #
      # ----------------------------------------------------

      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api/v1}
        VITE_NOTIFICATION_WS_DEBUG: ${VITE_NOTIFICATION_WS_DEBUG:-true}
        VITE_APP_VERSION: ${VITE_APP_VERSION:-vdev}


    container_name: finora-web
    restart: unless-stopped


    # ------------------------------------------------------
    # Backend Dependency
    # ------------------------------------------------------

    depends_on:
      backend:
        condition: service_healthy


    # ------------------------------------------------------
    # Public HTTP Port
    # ------------------------------------------------------

    ports:
      - "80:80"


    # ------------------------------------------------------
    # Web Health Check
    # ------------------------------------------------------

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://127.0.0.1/web-health || exit 1"
        ]

      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s


    # ------------------------------------------------------
    # Internal Network
    # ------------------------------------------------------

    networks:
      - finora_network


# ==========================================================
# Persistent Volumes
#
# PostgreSQL volume is intentionally absent.
#
# Database persistence belongs to Neon PostgreSQL.
# ==========================================================

volumes:

  backend_logs:
    name: finora_backend_logs


# ==========================================================
# Docker Network
# ==========================================================

networks:

  finora_network:
    name: finora_network
    driver: bridge