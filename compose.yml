# ==========================================================
# Finora - Docker Compose
#
# Complete Local Application Stack
#
# Database:
#   Neon PostgreSQL (deployed)
#
# Architecture:
#
#   Browser
#      │
#      ├──────────────► Frontend / Nginx :80
#      │
#      └──────────────► Backend :8000
#                              │
#                              │ SSL / PostgreSQL
#                              ▼
#                         Neon PostgreSQL
#
# IMPORTANT:
#
# There is NO local PostgreSQL container.
#
# Neon is the single canonical Finora database.
#
# ==========================================================


services:

  # ========================================================
  # FastAPI Backend
  # ========================================================

  #
  # Responsible for:
  #
  #   • FastAPI
  #   • Uvicorn
  #   • SQLAlchemy
  #   • Alembic
  #   • Backend quality tools
  #
  # Database:
  #
  #   Neon PostgreSQL
  #
  # Configuration:
  #
  #   ./backend/.env
  #
  # ========================================================

  backend:

    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: finora-backend

    restart: unless-stopped


    # ------------------------------------------------------
    # Application Environment
    # ------------------------------------------------------

    env_file:
      - ./backend/.env


    # ------------------------------------------------------
    # Backend Source Mount
    # ------------------------------------------------------

    volumes:
      - ./backend:/backend
      - /backend/.venv
      - backend_logs:/backend/logs


    # ------------------------------------------------------
    # Backend HTTP Port
    # ------------------------------------------------------

    #
    # Browser/API clients can reach FastAPI at:
    #
    #   http://localhost:8000/api/v1
    #
    # ------------------------------------------------------

    ports:
      - "8000:8000"


    # ------------------------------------------------------
    # Backend Health Check
    # ------------------------------------------------------

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -f http://localhost:8000/api/v1/health || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s


    # ------------------------------------------------------
    # Internal Network
    # ------------------------------------------------------

    networks:
      - finora_network



  # ========================================================
  # Web
  #
  # React Production Build + Nginx
  # ========================================================

  web:

    build:
      context: .
      dockerfile: infrastructure/web/Dockerfile

      # ----------------------------------------------------
      # Frontend Build Arguments
      # ----------------------------------------------------
      #
      # IMPORTANT:
      #
      # VITE_API_URL is a Vite build-time variable.
      #
      # The browser communicates directly with the local
      # FastAPI backend.
      #
      # ----------------------------------------------------

      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api/v1}


    container_name: finora-web

    restart: unless-stopped


    # ------------------------------------------------------
    # Backend Dependency
    # ------------------------------------------------------

    #
    # Start the frontend after the backend becomes healthy.
    #
    depends_on:
      backend:
        condition: service_healthy


    # ------------------------------------------------------
    # Public HTTP Port
    # ------------------------------------------------------

    ports:
      - "80:80"


    # ------------------------------------------------------
    # Web Health Check
    # ------------------------------------------------------

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://127.0.0.1/web-health || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s


    # ------------------------------------------------------
    # Internal Network
    # ------------------------------------------------------

    networks:
      - finora_network



# ==========================================================
# Persistent Volumes
# ==========================================================

#
# PostgreSQL volume has intentionally been removed.
#
# Neon owns database persistence.
#
# ==========================================================

volumes:

  backend_logs:
    name: finora_backend_logs



# ==========================================================
# Docker Network
# ==========================================================

networks:

  finora_network:
    name: finora_network
    driver: bridge

