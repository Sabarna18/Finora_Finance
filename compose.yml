# ==========================================================
# Finora - Docker Compose
#
# Docker-first development and quality-gate environment
#
# Architecture:
#
#   postgres
#       │
#       │ finora_network
#       ▼
#   backend
#       │
#       ├── backend-check.sh
#       ├── db-check.sh
#       ├── pytest
#       └── Alembic
#       │
#       ▼
#      web
#
# Quality gates:
#
#   make check
#       ├── backend quality gate  → Docker
#       ├── database quality gate → Docker
#       └── frontend quality gate → Host
#
# Database mutation:
#
#   make db-upgrade
#       └── Alembic upgrade head → Docker
#
# ==========================================================

services:
  # ========================================================
  # PostgreSQL
  # ========================================================

  postgres:
    image: postgres:17-alpine

    container_name: finora-postgres

    restart: unless-stopped

    # ------------------------------------------------------
    # PostgreSQL Environment
    # ------------------------------------------------------

    environment:
      POSTGRES_USER: ${POSTGRES_USER}

      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

      POSTGRES_DB: ${POSTGRES_DB}

    # ------------------------------------------------------
    # PostgreSQL Storage
    # ------------------------------------------------------

    volumes:
      - postgres_data:/var/lib/postgresql/data

    # ------------------------------------------------------
    # PostgreSQL Host Port
    #
    # Host:
    #
    #   localhost:5432
    #
    # Docker network:
    #
    #   postgres:5432
    #
    # IMPORTANT:
    #
    # Native PostgreSQL must not already be occupying
    # host port 5432.
    # ------------------------------------------------------

    ports:
      - "5432:5432"

    # ------------------------------------------------------
    # PostgreSQL Health Check
    # ------------------------------------------------------

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]

      interval: 5s

      timeout: 5s

      retries: 10

      start_period: 10s

    # ------------------------------------------------------
    # Internal Network
    # ------------------------------------------------------

    networks:
      - finora_network

  # ========================================================
  # FastAPI Backend
  #
  # This container is the execution environment for:
  #
  #   • FastAPI
  #   • pytest
  #   • Ruff
  #   • Black
  #   • Alembic
  #   • backend-check.sh
  #   • db-check.sh
  #
  # The entire backend directory is bind-mounted so that:
  #
  #   Host backend/
  #          ↓
  #   Docker /backend/
  #
  # Therefore quality-gate fixes made inside Docker are
  # immediately visible on the host working tree.
  # ========================================================

  backend:
    build:
      context: ./backend

      dockerfile: Dockerfile

    container_name: finora-backend

    restart: unless-stopped

    # ------------------------------------------------------
    # Base Application Environment
    #
    # backend/.env provides the general application
    # configuration.
    #
    # Docker-specific PostgreSQL values are overridden
    # below.
    # ------------------------------------------------------

    env_file:
      - ./backend/.env

    # ------------------------------------------------------
    # Docker Backend Environment
    #
    # IMPORTANT:
    #
    # Inside Docker:
    #
    #   localhost = backend container
    #
    # PostgreSQL therefore MUST be:
    #
    #   postgres:5432
    # ------------------------------------------------------

    environment:
      DB_TYPE: postgresql

      POSTGRES_HOST: postgres

      POSTGRES_PORT: 5432

      POSTGRES_USER: ${POSTGRES_USER}

      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

      POSTGRES_DB: ${POSTGRES_DB}

    # ------------------------------------------------------
    # Backend Source Mount
    #
    # REQUIRED for Docker-first quality gates.
    #
    # Makes:
    #
    #   ./backend/scripts/backend-check.sh
    #
    # available inside the container as:
    #
    #   /backend/scripts/backend-check.sh
    #
    # It also makes source-code formatting/fixes performed
    # by Ruff and Black visible on the host.
    # ------------------------------------------------------

    volumes:
      - ./backend:/backend

      - backend_logs:/backend/logs

    # ------------------------------------------------------
    # PostgreSQL Dependency
    # ------------------------------------------------------

    depends_on:
      postgres:
        condition: service_healthy

    # ------------------------------------------------------
    # Internal Backend Port
    # ------------------------------------------------------

    expose:
      - "8000"

    # ------------------------------------------------------
    # Backend Health Check
    # ------------------------------------------------------

    healthcheck:
      test:
        ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/health || exit 1"]

      interval: 10s

      timeout: 5s

      retries: 5

      start_period: 20s

    # ------------------------------------------------------
    # Internal Network
    # ------------------------------------------------------

    networks:
      - finora_network

  # ========================================================
  # SQLite → PostgreSQL Migration
  #
  # One-time migration service.
  #
  # NOT started by:
  #
  #   docker compose up
  #
  # Run explicitly with:
  #
  #   docker compose --profile migration run --rm migration
  #
  # ========================================================

  migration:
    profiles:
      - migration

    build:
      context: ./backend

      dockerfile: Dockerfile

    container_name: finora-migration

    # ------------------------------------------------------
    # Base Migration Environment
    # ------------------------------------------------------

    env_file:
      - ./backend/.env

    # ------------------------------------------------------
    # Docker Migration Environment
    #
    # PostgreSQL is reached through:
    #
    #   postgres:5432
    # ------------------------------------------------------

    environment:
      DB_TYPE: postgresql

      POSTGRES_HOST: postgres

      POSTGRES_PORT: 5432

      POSTGRES_USER: ${POSTGRES_USER}

      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

      POSTGRES_DB: ${POSTGRES_DB}

    # ------------------------------------------------------
    # PostgreSQL Dependency
    # ------------------------------------------------------

    depends_on:
      postgres:
        condition: service_healthy

    # ------------------------------------------------------
    # Backend Source
    #
    # Mounting the backend directory ensures the migration
    # script exists at:
    #
    #   /backend/scripts/migrate_sqlite_to_postgres.py
    # ------------------------------------------------------

    volumes:
      - ./backend:/backend

      # ------------------------------------------------------
      # SQLite Source Database
      #
      # Read-only protection is intentionally preserved.
      #
      # The migration process cannot modify the original
      # SQLite database.
      # ------------------------------------------------------

      - ./backend/finance.db:/backend/finance.db:ro

    # ------------------------------------------------------
    # Migration Entrypoint
    #
    # Do NOT start FastAPI here.
    # ------------------------------------------------------

    entrypoint: ["python", "/backend/scripts/migrate_sqlite_to_postgres.py"]

    # ------------------------------------------------------
    # One-shot Service
    # ------------------------------------------------------

    restart: "no"

    # ------------------------------------------------------
    # Internal Network
    # ------------------------------------------------------

    networks:
      - finora_network

  # ========================================================
  # Web
  #
  # React production build + Nginx
  # ========================================================

  web:
    build:
      context: .

      dockerfile: infrastructure/web/Dockerfile

      # ----------------------------------------------------
      # Frontend Build Arguments
      # ----------------------------------------------------

      args:
        VITE_API_URL: ${VITE_API_URL:-/api/v1}

    container_name: finora-web

    restart: unless-stopped

    # ------------------------------------------------------
    # Backend Dependency
    # ------------------------------------------------------

    depends_on:
      backend:
        condition: service_healthy

    # ------------------------------------------------------
    # Public HTTP Port
    # ------------------------------------------------------

    ports:
      - "80:80"

    # ------------------------------------------------------
    # Web Health Check
    # ------------------------------------------------------

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost/web-health || exit 1",
        ]

      interval: 10s

      timeout: 5s

      retries: 5

      start_period: 10s

    # ------------------------------------------------------
    # Internal Network
    # ------------------------------------------------------

    networks:
      - finora_network

# ==========================================================
# Persistent Volumes
# ==========================================================

volumes:
  postgres_data:
    name: finora_postgres_data

  backend_logs:
    name: finora_backend_logs

# ==========================================================
# Docker Network
# ==========================================================

networks:
  finora_network:
    name: finora_network

    driver: bridge
