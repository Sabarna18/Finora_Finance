# ==========================================================
# Finora - Docker Compose
#
# Complete Local / CI Validation Application Stack
#
# Database:
#   External PostgreSQL
#
# Local development:
#   Neon PostgreSQL
#
# CI / Release validation:
#   Dedicated CI PostgreSQL
#
# Architecture:
#
#   Browser
#      │
#      ├──────────────► Frontend / Nginx :80
#      │                    │
#      │                    │ static React application
#      │                    │
#      │                    └── Browser API calls use
#      │                        VITE_API_URL
#      │
#      └──────────────► Backend :8000
#                              │
#                              │ SSL / PostgreSQL
#                              ▼
#                       External PostgreSQL
#
# IMPORTANT:
#
#   - There is NO local PostgreSQL container.
#   - Database configuration belongs to backend/.env.
#   - VITE_API_URL is a Vite build-time variable.
#   - VITE_API_URL MUST be supplied explicitly by the caller.
#   - This Compose file does NOT hardcode a frontend API origin.
#
# Examples:
#
#   Local:
#     VITE_API_URL=http://localhost:8000/api/v1 docker compose up --build
#
#   CI:
#     VITE_API_URL=http://localhost:8000/api/v1 ./scripts/docker.sh
#
#   Release:
#     VITE_API_URL=https://finora-backend-latest.onrender.com/api/v1 \
#       ./scripts/docker.sh
#
# ==========================================================

services:
  # ========================================================
  # FastAPI Backend
  # ========================================================

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: finora-backend
    restart: unless-stopped

    # ------------------------------------------------------
    # Backend Environment
    # ------------------------------------------------------

    env_file:
      - ./backend/.env

    # ------------------------------------------------------
    # Backend Source Mount
    # ------------------------------------------------------

    volumes:
      - ./backend:/backend
      - /backend/.venv
      - backend_logs:/backend/logs

    # ------------------------------------------------------
    # Backend HTTP Port
    # ------------------------------------------------------

    ports:
      - "8000:8000"

    # ------------------------------------------------------
    # Backend Health Check
    # ------------------------------------------------------

    healthcheck:
      test:
        ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

    # ------------------------------------------------------
    # Internal Network
    # ------------------------------------------------------

    networks:
      - finora_network

  # ========================================================
  # Web
  #
  # React Production Build + Nginx
  # ========================================================

  web:
    build:
      context: .
      dockerfile: infrastructure/web/Dockerfile

      # ----------------------------------------------------
      # Frontend Build Arguments
      # ----------------------------------------------------
      #
      # VITE_API_URL is a Vite build-time variable.
      #
      # IMPORTANT:
      #
      # It MUST be explicitly supplied by the caller.
      #
      # This prevents:
      #
      #   /api/v1
      #
      # or any other unintended fallback from being baked
      # into the released frontend artifact.
      #
      # The value is supplied by:
      #
      #   docker.yml  → local CI validation URL
      #   release.yml → Render production URL
      #
      # ----------------------------------------------------

      args:
        VITE_API_URL: ${VITE_API_URL:?VITE_API_URL must be explicitly provided}

    container_name: finora-web
    restart: unless-stopped

    # ------------------------------------------------------
    # Backend Dependency
    # ------------------------------------------------------
    #
    # Local / CI validation starts the web container after
    # the backend becomes healthy.
    #
    # ------------------------------------------------------

    depends_on:
      backend:
        condition: service_healthy

    # ------------------------------------------------------
    # Public HTTP Port
    # ------------------------------------------------------

    ports:
      - "80:80"

    # ------------------------------------------------------
    # Web Health Check
    # ------------------------------------------------------

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://127.0.0.1/web-health || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    # ------------------------------------------------------
    # Internal Network
    # ------------------------------------------------------

    networks:
      - finora_network

# ==========================================================
# Persistent Volumes
# ==========================================================
#
# PostgreSQL volume is intentionally absent.
#
# Database persistence belongs to the external PostgreSQL
# provider.
#
# ==========================================================

volumes:
  backend_logs:
    name: finora_backend_logs

# ==========================================================
# Docker Network
# ==========================================================

networks:
  finora_network:
    name: finora_network
    driver: bridge
