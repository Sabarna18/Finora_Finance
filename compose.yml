# ==========================================================
# Finora - Docker Compose
#
# Complete Local Development Application Stack
#
# Database:
#   External PostgreSQL
#
# Local development:
#   Backend + Web run locally in Docker
#   Database remains cloud hosted (Neon PostgreSQL)
#
# Architecture:
#
#   Browser
#      │
#      ├──────────────► Web / Nginx :80
#      │                    │
#      │                    └── React static application
#      │
#      └──────────────► Backend :8000
#                              │
#                              │ SSL / PostgreSQL
#                              ▼
#                         Neon PostgreSQL
#
# IMPORTANT:
#
#   - There is NO local PostgreSQL container.
#   - Database configuration belongs to backend/.env.
#   - VITE_API_URL is a Vite build-time variable.
#   - Local development defaults VITE_API_URL to:
#         http://localhost:8000/api/v1
#   - Production CI/CD can override VITE_API_URL explicitly.
#
# Local usage:
#
#   docker compose up --build
#
# Then open:
#
#   http://localhost
#
# Backend health:
#
#   http://localhost:8000/api/v1/health
#
# ==========================================================

services:

  # ========================================================
  # FastAPI Backend
  # ========================================================

  backend:

    build:
      context: ./backend
      dockerfile: Dockerfile

      # ----------------------------------------------------
      # Backend Build Arguments
      # ----------------------------------------------------
      #
      # APP_VERSION is embedded into the Docker image.
      #
      # Local development:
      #   APP_VERSION=vdev
      #
      # Release pipeline:
      #   APP_VERSION=1.0.5
      #
      # This allows the VPS deployment script to inspect the
      # published image and determine which Finora release
      # it contains.
      #
      args:
        APP_VERSION: ${APP_VERSION:-vdev}

    container_name: finora-backend
    restart: unless-stopped

    # ------------------------------------------------------
    # Backend Environment
    # ------------------------------------------------------
    #
    # The backend .env contains the cloud PostgreSQL/Neon
    # connection and backend secrets.
    #
    # Compose-level defaults below keep local browser access
    # working without requiring production environment values.
    #

    env_file:
      - ./backend/.env

    environment:
      DEBUG: ${DEBUG:-true}

      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-["http://localhost","http://localhost:80"]}

      # Runtime application version.
      #
      # This should match the build argument above for normal
      # local/release builds.
      APP_VERSION: ${APP_VERSION:-vdev}

    # ------------------------------------------------------
    # Backend Source Mount
    # ------------------------------------------------------
    #
    # Keeps local development convenient: source changes are
    # visible inside the running container.
    #

    volumes:
      - ./backend:/backend
      - /backend/.venv
      - backend_logs:/backend/logs

    # ------------------------------------------------------
    # Backend HTTP Port
    # ------------------------------------------------------

    ports:
      - "8000:8000"

    # ------------------------------------------------------
    # Backend Health Check
    # ------------------------------------------------------

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -f http://localhost:8000/api/v1/health || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

    # ------------------------------------------------------
    # Internal Network
    # ------------------------------------------------------

    networks:
      - finora_network


  # ========================================================
  # Web
  #
  # React Production Build + Nginx
  # ========================================================

  web:

    build:
      context: .
      dockerfile: infrastructure/web/Dockerfile

      # ----------------------------------------------------
      # Frontend Build Arguments
      # ----------------------------------------------------
      #
      # Vite variables are embedded during npm build.
      #
      # Local defaults:
      #
      #   VITE_API_URL=http://localhost:8000/api/v1
      #   VITE_APP_VERSION=vdev
      #
      # CI/CD may override these values explicitly.
      #

      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api/v1}
        VITE_APP_VERSION: ${VITE_APP_VERSION:-vdev}

    container_name: finora-web
    restart: unless-stopped

    # ------------------------------------------------------
    # Backend Dependency
    # ------------------------------------------------------
    #
    # Do not start the web container until the API is healthy.
    #

    depends_on:
      backend:
        condition: service_healthy

    # ------------------------------------------------------
    # Public HTTP Port
    # ------------------------------------------------------

    ports:
      - "80:80"

    # ------------------------------------------------------
    # Web Health Check
    # ------------------------------------------------------

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://127.0.0.1/web-health || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    # ------------------------------------------------------
    # Internal Network
    # ------------------------------------------------------

    networks:
      - finora_network


# ==========================================================
# Persistent Volumes
#
# PostgreSQL volume is intentionally absent.
#
# Database persistence belongs to Neon PostgreSQL.
# ==========================================================

volumes:

  backend_logs:
    name: finora_backend_logs


# ==========================================================
# Docker Network
# ==========================================================

networks:

  finora_network:
    name: finora_network
    driver: bridge

