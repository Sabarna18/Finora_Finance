# ==========================================================
# Finora - Docker Compose
# ==========================================================

services:

  # ========================================================
  # PostgreSQL
  # ========================================================

  postgres:
    image: postgres:17-alpine
    container_name: finora-postgres
    restart: unless-stopped

    # ------------------------------------------------------
    # PostgreSQL Environment
    # ------------------------------------------------------

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    # ------------------------------------------------------
    # PostgreSQL Storage
    # ------------------------------------------------------

    volumes:
      - postgres_data:/var/lib/postgresql/data

    # ------------------------------------------------------
    # PostgreSQL Host Port
    #
    # Required so Alembic can connect from the host machine:
    #
    #   localhost:5432
    #
    # Docker services still connect using:
    #
    #   postgres:5432
    # ------------------------------------------------------

    ports:
      - "5432:5432"

    # ------------------------------------------------------
    # PostgreSQL Health Check
    # ------------------------------------------------------

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

    # ------------------------------------------------------
    # Internal Network
    # ------------------------------------------------------

    networks:
      - finora_network


  # ========================================================
  # FastAPI Backend
  # ========================================================

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: finora-backend
    restart: unless-stopped

    # ------------------------------------------------------
    # Backend Environment
    # ------------------------------------------------------

    env_file:
      - ./backend/.env

    # ------------------------------------------------------
    # PostgreSQL Dependency
    # ------------------------------------------------------

    depends_on:
      postgres:
        condition: service_healthy

    # ------------------------------------------------------
    # Internal Backend Port
    # ------------------------------------------------------

    expose:
      - "8000"

    # ------------------------------------------------------
    # Backend Logs
    # ------------------------------------------------------

    volumes:
      - backend_logs:/backend/logs

    # ------------------------------------------------------
    # Backend Health Check
    # ------------------------------------------------------

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -f http://localhost:8000/api/v1/health || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

    # ------------------------------------------------------
    # Internal Network
    # ------------------------------------------------------

    networks:
      - finora_network


  # ========================================================
  # SQLite → PostgreSQL Migration
  #
  # One-time migration service.
  #
  # NOT started by:
  #
  #   docker compose up
  #
  # Run explicitly with:
  #
  #   docker compose --profile migration run --rm migration
  # ========================================================

  migration:
    profiles:
      - migration

    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: finora-migration

    # ------------------------------------------------------
    # Migration Environment
    # ------------------------------------------------------

    env_file:
      - ./backend/.env

    # ------------------------------------------------------
    # PostgreSQL Dependency
    # ------------------------------------------------------

    depends_on:
      postgres:
        condition: service_healthy

    # ------------------------------------------------------
    # SQLite Source Database
    #
    # Read-only mount.
    #
    # The original finance.db can never be modified
    # by the migration container.
    # ------------------------------------------------------

    volumes:
      - ./backend/finance.db:/backend/finance.db:ro

    # ------------------------------------------------------
    # Migration Entrypoint
    #
    # Do not start FastAPI here.
    # ------------------------------------------------------

    entrypoint:
      [
        "python",
        "/backend/scripts/migrate_sqlite_to_postgres.py"
      ]

    # ------------------------------------------------------
    # One-shot Service
    # ------------------------------------------------------

    restart: "no"

    # ------------------------------------------------------
    # Internal Network
    # ------------------------------------------------------

    networks:
      - finora_network


  # ========================================================
  # Web
  #
  # React production build + Nginx reverse proxy
  # ========================================================

  web:
    build:
      context: .
      dockerfile: infrastructure/web/Dockerfile

      # ----------------------------------------------------
      # Frontend Build Arguments
      # ----------------------------------------------------

      args:
        VITE_API_URL: ${VITE_API_URL:-/api/v1}

    container_name: finora-web
    restart: unless-stopped

    # ------------------------------------------------------
    # Backend Dependency
    # ------------------------------------------------------

    depends_on:
      backend:
        condition: service_healthy

    # ------------------------------------------------------
    # Public HTTP Port
    # ------------------------------------------------------

    ports:
      - "80:80"

    # ------------------------------------------------------
    # Web Health Check
    # ------------------------------------------------------

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost/web-health || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    # ------------------------------------------------------
    # Internal Network
    # ------------------------------------------------------

    networks:
      - finora_network


# ==========================================================
# Persistent Volumes
# ==========================================================

volumes:

  postgres_data:
    name: finora_postgres_data

  backend_logs:
    name: finora_backend_logs


# ==========================================================
# Docker Network
# ==========================================================

networks:

  finora_network:
    name: finora_network
    driver: bridge

