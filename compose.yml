# ==========================================================
# Finora - Docker Compose
#
# Local application stack
#
# Database:
#   Neon PostgreSQL (deployed)
#
# Architecture:
#
#   web
#    │
#    ▼
#   backend
#    │
#    │ SSL / PostgreSQL
#    ▼
#   Neon PostgreSQL
#
# IMPORTANT:
#
# There is NO local PostgreSQL container.
# Neon is the single canonical Finora database.
#
# ==========================================================


services:

  # ========================================================
  # FastAPI Backend
  # ========================================================
  #
  # The backend container is responsible for:
  #
  #   • FastAPI
  #   • Uvicorn
  #   • SQLAlchemy
  #   • Alembic
  #   • Backend quality tools
  #
  # Database:
  #
  #   Neon PostgreSQL
  #
  # Configuration is loaded from:
  #
  #   ./backend/.env
  #
  # ========================================================

  backend:

    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: finora-backend

    restart: unless-stopped

    # ------------------------------------------------------
    # Application Environment
    # ------------------------------------------------------
    #
    # backend/.env contains the Neon configuration.
    #
    # Required database variables:
    #
    #   POSTGRES_HOST
    #   POSTGRES_PORT
    #   POSTGRES_DB
    #   POSTGRES_USER
    #   POSTGRES_PASSWORD
    #   POSTGRES_SSLMODE=require
    #
    # ------------------------------------------------------

    env_file:
      - ./backend/.env

    # ------------------------------------------------------
    # Backend Source Mount
    # ------------------------------------------------------
    #
    # Keeps local source code synchronized with the
    # container and supports Docker-first development.
    #
    # The named /backend/.venv volume prevents the host
    # environment from overwriting the container venv.
    #
    # ------------------------------------------------------

    volumes:
      - ./backend:/backend
      - /backend/.venv
      - backend_logs:/backend/logs

    # ------------------------------------------------------
    # Internal Backend Port
    # ------------------------------------------------------

    expose:
      - "8000"

    # ------------------------------------------------------
    # Backend Health Check
    # ------------------------------------------------------

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -f http://localhost:8000/api/v1/health || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

    # ------------------------------------------------------
    # Internal Network
    # ------------------------------------------------------

    networks:
      - finora_network


  # ========================================================
  # Web
  #
  # React production build + Nginx
  # ========================================================

  web:

    build:
      context: .
      dockerfile: infrastructure/web/Dockerfile

      # ----------------------------------------------------
      # Frontend Build Arguments
      # ----------------------------------------------------

      args:
        VITE_API_URL: ${VITE_API_URL:-/api/v1}

    container_name: finora-web

    restart: unless-stopped

    # ------------------------------------------------------
    # Backend Dependency
    # ------------------------------------------------------
    #
    # Nginx starts after the backend health check passes.
    #
    # ------------------------------------------------------

    depends_on:
      backend:
        condition: service_healthy

    # ------------------------------------------------------
    # Public HTTP Port
    # ------------------------------------------------------

    ports:
      - "80:80"

    # ------------------------------------------------------
    # Web Health Check
    # ------------------------------------------------------

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://127.0.0.1/web-health || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    # ------------------------------------------------------
    # Internal Network
    # ------------------------------------------------------

    networks:
      - finora_network


# ==========================================================
# Persistent Volumes
# ==========================================================
#
# PostgreSQL volume has intentionally been removed.
#
# Neon owns the database persistence.
#
# ==========================================================

volumes:

  backend_logs:
    name: finora_backend_logs


# ==========================================================
# Docker Network
# ==========================================================

networks:

  finora_network:
    name: finora_network
    driver: bridge

