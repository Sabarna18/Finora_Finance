# ==========================================================
# Finora Web Server
# React static files + health endpoint
#
# Architecture:
#
#   Browser
#      │
#      ├──────────────► localhost:80
#      │                    │
#      │                    ▼
#      │                  Nginx
#      │                    │
#      │                    └── static React application
#      │
#      └──────────────► localhost:8000/api/v1
#                           │
#                           ▼
#                         FastAPI
#                           │
#                           ▼
#                       Neon PostgreSQL
#
# IMPORTANT:
#
#   Nginx serves the React application only.
#   API requests are NOT proxied through Nginx.
#
#   The Vite application calls the backend directly using
#   the build-time VITE_API_URL value.
#
#   Local:
#       http://localhost:8000/api/v1
#
#   Production:
#       CI injects the production VITE_API_URL during build.
#
#   Backend CORS is responsible for allowing the frontend
#   origin. It is configured separately in the backend
#   environment.
# ==========================================================


events {}


http {

    # ------------------------------------------------------
    # Basic HTTP configuration
    # ------------------------------------------------------

    include /etc/nginx/mime.types;

    default_type application/octet-stream;

    sendfile on;

    keepalive_timeout 65;


    # ======================================================
    # Finora Web Application
    # ======================================================

    server {

        listen 80;

        server_name _;


        # ==================================================
        # React Application
        # ==================================================
        #
        # React Router requires unknown application routes
        # to fall back to index.html.
        #
        # Example:
        #   /dashboard
        #   /transactions
        #   /budgets
        #   /reports
        #
        # ==================================================

        location / {

            root /usr/share/nginx/html;

            index index.html;

            try_files $uri $uri/ /index.html;
        }


        # ==================================================
        # Static Assets
        # ==================================================
        #
        # Vite-generated assets are content-hashed and can
        # safely be cached for a long period.
        #
        # ==================================================

        location /assets/ {

            root /usr/share/nginx/html;

            expires 1y;

            add_header Cache-Control "public, immutable";
        }


        # ==================================================
        # Web Health Check
        # ==================================================

        location = /web-health {

            access_log off;

            default_type text/plain;

            return 200 "web ok\n";
        }
    }
}