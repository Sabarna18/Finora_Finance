# ==========================================================
# Finora Web Server
# React static files + health endpoint
# ==========================================================

events {}

http {

    # ------------------------------------------------------
    # Basic configuration
    # ------------------------------------------------------

    include /etc/nginx/mime.types;

    default_type application/octet-stream;

    sendfile on;

    keepalive_timeout 65;


    # ======================================================
    # SERVER
    # ======================================================

    server {

        listen 80;

        server_name _;


        # ==================================================
        # REACT APPLICATION
        # ==================================================

        location / {

            root /usr/share/nginx/html;

            index index.html;

            # --------------------------------------------------
            # React Router
            # --------------------------------------------------

            try_files $uri $uri/ /index.html;
        }


        # ==================================================
        # STATIC ASSETS
        # ==================================================

        location /assets/ {

            root /usr/share/nginx/html;

            expires 1y;

            add_header Cache-Control "public, immutable";
        }


        # ==================================================
        # WEB HEALTH CHECK
        # ==================================================

        location = /web-health {

            access_log off;

            default_type text/plain;

            return 200 "web ok\n";
        }
    }
}

