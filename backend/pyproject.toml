[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.4",
    "fastapi>=0.136.0",
    "passlib[bcrypt]>=1.7.4",
    "pydantic[email]>=2.13.3",
    "pydantic-settings>=2.14.0",
    "python-dotenv>=1.2.2",
    "python-jose[email]>=3.5.0",
    "python-multipart>=0.0.26",
    "sqlalchemy>=2.0.49",
    "uvicorn>=0.45.0",
    "psycopg2-binary>=2.9,<3",
    "pytest>=9.1.1",
    "httpx>=0.28.1",
    "ruff>=0.16.4",
    "black>=26.5.1",
]


[tool.ruff]
target-version = "py313"
line-length = 88


[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "B",
    "UP",
    "DTZ",
]

ignore = [
    "B008",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]