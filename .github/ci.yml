# ==========================================================
# Finora - Continuous Integration
# ==========================================================
#
# Validates:
#   1. Backend
#   2. Frontend
#   3. Backend + PostgreSQL integration
#
# Trigger:
#   - Every push
#   - Every pull request
#
# This workflow validates the application only.
# Deployment and image publishing belong to separate workflows.
# ==========================================================

name: Finora CI

# ==========================================================
# TRIGGERS
# ==========================================================

on:

  push:

  pull_request:

# ==========================================================
# GLOBAL ENVIRONMENT
# ==========================================================

env:

  PYTHON_VERSION: "3.13"
  NODE_VERSION: "22"

# ==========================================================
# CONCURRENCY
# ==========================================================
#
# Cancel outdated CI runs for the same branch/PR.
# This prevents wasting GitHub Actions minutes when
# multiple commits are pushed quickly.
# ==========================================================

concurrency:

  group: finora-ci-${{ github.workflow }}-${{ github.ref }}

  cancel-in-progress: true

# ==========================================================
# JOBS
# ==========================================================

jobs:

  # ========================================================
  # BACKEND VALIDATION
  # ========================================================

  backend:

    name: Backend Validation

    runs-on: ubuntu-latest

    steps:

      # ----------------------------------------------------
      # Checkout
      # ----------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      # ----------------------------------------------------
      # Python
      # ----------------------------------------------------

      - name: Set up Python
        uses: actions/setup-python@v5

        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # ----------------------------------------------------
      # Install uv
      # ----------------------------------------------------

      - name: Install uv
        uses: astral-sh/setup-uv@v6

        with:
          version: "latest"

      # ----------------------------------------------------
      # Dependency cache
      # ----------------------------------------------------

      - name: Install backend dependencies
        working-directory: backend

        run: |
          uv sync --frozen

      # ----------------------------------------------------
      # Backend syntax / import validation
      # ----------------------------------------------------

      - name: Validate backend imports
        working-directory: backend

        env:
          DB_TYPE: sqlite
          SQLITE_DB_PATH: ./ci_finance.db
          APP_NAME: Finora
          DEBUG: "false"
          SECRET_KEY: ci-test-secret-key
          ALGORITHM: HS256
          ACCESS_TOKEN_EXPIRE_MINUTES: "60"
          BACKEND_CORS_ORIGINS: '["http://localhost"]'

        run: |
          uv run python -c "
          from src.app import app
          from src.core.config import settings
          from src.db.database import Base
          print('Backend imports: OK')
          print('FastAPI application: OK')
          print('Database metadata: OK')
          "

      # ----------------------------------------------------
      # Tests
      # ----------------------------------------------------

      - name: Run backend tests
        working-directory: backend

        env:
          DB_TYPE: sqlite
          SQLITE_DB_PATH: ./ci_finance.db
          APP_NAME: Finora
          DEBUG: "false"
          SECRET_KEY: ci-test-secret-key
          ALGORITHM: HS256
          ACCESS_TOKEN_EXPIRE_MINUTES: "60"
          BACKEND_CORS_ORIGINS: '["http://localhost"]'

        run: |
          uv run pytest -v

      # ----------------------------------------------------
      # Alembic validation
      # ----------------------------------------------------

      - name: Validate Alembic configuration
        working-directory: backend

        env:
          DB_TYPE: sqlite
          SQLITE_DB_PATH: ./ci_finance.db
          APP_NAME: Finora
          DEBUG: "false"
          SECRET_KEY: ci-test-secret-key
          ALGORITHM: HS256
          ACCESS_TOKEN_EXPIRE_MINUTES: "60"
          BACKEND_CORS_ORIGINS: '["http://localhost"]'

        run: |
          uv run alembic check


  # ========================================================
  # FRONTEND VALIDATION
  # ========================================================

  frontend:

    name: Frontend Validation

    runs-on: ubuntu-latest

    steps:

      # ----------------------------------------------------
      # Checkout
      # ----------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      # ----------------------------------------------------
      # Node.js
      # ----------------------------------------------------

      - name: Set up Node.js
        uses: actions/setup-node@v4

        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # ----------------------------------------------------
      # Install dependencies
      # ----------------------------------------------------

      - name: Install frontend dependencies
        working-directory: frontend

        run: |
          npm ci

      # ----------------------------------------------------
      # Lint
      # ----------------------------------------------------

      - name: Run ESLint
        working-directory: frontend

        run: |
          npm run lint

      # ----------------------------------------------------
      # Production build
      # ----------------------------------------------------

      - name: Build frontend
        working-directory: frontend

        env:
          VITE_API_URL: /api/v1

        run: |
          npm run build


  # ========================================================
  # INTEGRATION TEST
  # ========================================================
  #
  # Runs the actual backend against PostgreSQL.
  #
  # This catches problems that SQLite-based unit tests cannot:
  #
  #   - PostgreSQL connection
  #   - psycopg2
  #   - SQLAlchemy PostgreSQL dialect
  #   - Alembic migrations
  #   - PostgreSQL schema
  #   - application startup
  #
  # ========================================================

  integration:

    name: PostgreSQL Integration

    runs-on: ubuntu-latest

    needs:
      - backend
      - frontend

    services:

      # ----------------------------------------------------
      # PostgreSQL
      # ----------------------------------------------------

      postgres:

        image: postgres:17-alpine

        env:

          POSTGRES_USER: finora
          POSTGRES_PASSWORD: password
          POSTGRES_DB: finance_db

        ports:

          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U finora -d finance_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:

      # ----------------------------------------------------
      # Checkout
      # ----------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      # ----------------------------------------------------
      # Python
      # ----------------------------------------------------

      - name: Set up Python
        uses: actions/setup-python@v5

        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # ----------------------------------------------------
      # Install uv
      # ----------------------------------------------------

      - name: Install uv
        uses: astral-sh/setup-uv@v6

        with:
          version: "latest"

      # ----------------------------------------------------
      # Install backend dependencies
      # ----------------------------------------------------

      - name: Install backend dependencies
        working-directory: backend

        run: |
          uv sync --frozen

      # ----------------------------------------------------
      # Database environment
      # ----------------------------------------------------

      - name: Run database migrations
        working-directory: backend

        env:

          APP_NAME: Finora
          DEBUG: "false"

          DB_TYPE: postgresql

          POSTGRES_USER: finora
          POSTGRES_PASSWORD: password
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_DB: finance_db

          SECRET_KEY: ci-test-secret-key
          ALGORITHM: HS256
          ACCESS_TOKEN_EXPIRE_MINUTES: "60"

          BACKEND_CORS_ORIGINS: '["http://localhost"]'

        run: |
          uv run alembic upgrade head

      # ----------------------------------------------------
      # Verify database schema
      # ----------------------------------------------------

      - name: Verify PostgreSQL schema
        working-directory: backend

        env:

          DB_TYPE: postgresql

          POSTGRES_USER: finora
          POSTGRES_PASSWORD: password
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_DB: finance_db

          SECRET_KEY: ci-test-secret-key
          BACKEND_CORS_ORIGINS: '["http://localhost"]'

        run: |
          uv run python -c "
          from sqlalchemy import create_engine, inspect
          from src.db.database import DATABASE_URL

          engine = create_engine(DATABASE_URL)

          inspector = inspect(engine)

          tables = inspector.get_table_names()

          print('PostgreSQL tables:')
          for table in tables:
              print(' -', table)

          required = {
              'users',
              'categories',
              'transactions',
              'budgets',
          }

          missing = required - set(tables)

          if missing:
              raise RuntimeError(
                  f'Missing required tables: {missing}'
              )

          print('PostgreSQL schema validation: OK')
          "

      # ----------------------------------------------------
      # Start backend
      # ----------------------------------------------------

      - name: Start backend
        working-directory: backend

        env:

          APP_NAME: Finora
          DEBUG: "false"

          DB_TYPE: postgresql

          POSTGRES_USER: finora
          POSTGRES_PASSWORD: password
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_DB: finance_db

          SECRET_KEY: ci-test-secret-key
          ALGORITHM: HS256
          ACCESS_TOKEN_EXPIRE_MINUTES: "60"

          BACKEND_CORS_ORIGINS: '["http://localhost"]'

        run: |
          uv run uvicorn \
            src.app:app \
            --host 127.0.0.1 \
            --port 8000 \
            > backend.log 2>&1 &

          echo $! > backend.pid

      # ----------------------------------------------------
      # Wait for API
      # ----------------------------------------------------

      - name: Wait for backend
        run: |
          for i in {1..30}; do

            if curl --fail --silent \
              http://127.0.0.1:8000/api/v1/health; then

              echo ""
              echo "Backend is healthy."
              exit 0

            fi

            echo "Waiting for backend..."
            sleep 2

          done

          echo ""
          echo "Backend failed to become healthy."
          echo ""
          cat backend/backend.log || true

          exit 1

      # ----------------------------------------------------
      # API health validation
      # ----------------------------------------------------

      - name: Validate API health
        run: |
          curl --fail \
            --show-error \
            http://127.0.0.1:8000/api/v1/health

      # ----------------------------------------------------
      # Cleanup
      # ----------------------------------------------------

      - name: Stop backend
        if: always()
        working-directory: backend

        run: |
          if [ -f backend.pid ]; then
            kill "$(cat backend.pid)" || true
          fi

