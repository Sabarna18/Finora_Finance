# ==========================================================
# Finora - Continuous Integration
# ==========================================================
#
# CI Architecture
#
#   GitHub Actions
#        │
#        ├──────────────────────┐
#        │                      │
#        ▼                      ▼
#   Backend Check         Frontend Check
#        │                      │
#        │                      │
#        ▼                      │
#   Isolated Tests              │
#                               │
#        └──────────┬───────────┘
#                   │
#                   ▼
#               CI PASSED
#
# IMPORTANT
#
#   This workflow validates source code.
#
#   Docker image validation is handled separately by:
#
#       .github/workflows/docker.yml
#
#   Release image validation is handled by:
#
#       .github/workflows/release.yml
#
# Frontend API configuration:
#
#   The frontend build MUST use an explicit absolute URL.
#
#   CI validation:
#
#       http://localhost:8000/api/v1
#
#   Production release:
#
#       https://finora-backend-latest.onrender.com/api/v1
#
#   This workflow does not publish Docker images.
#
# ==========================================================

name: Finora CI

# ==========================================================
# TRIGGERS
# ==========================================================

on:
  push:

  pull_request:

# ==========================================================
# GLOBAL ENVIRONMENT
# ==========================================================

env:
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "22"

  # --------------------------------------------------------
  # PostgreSQL
  # --------------------------------------------------------

  POSTGRES_HOST: localhost
  POSTGRES_PORT: "5432"
  POSTGRES_USER: finora
  POSTGRES_PASSWORD: password
  POSTGRES_DB: finance_db

  # --------------------------------------------------------
  # Application
  # --------------------------------------------------------

  APP_NAME: Finora
  DEBUG: "false"
  DB_TYPE: postgresql

  SECRET_KEY: ci-test-secret-key
  ALGORITHM: HS256
  ACCESS_TOKEN_EXPIRE_MINUTES: "60"

  BACKEND_CORS_ORIGINS: '["http://localhost"]'

  # --------------------------------------------------------
  # Frontend
  #
  # This is an absolute URL intentionally.
  #
  # The previous relative value:
  #
  #   /api/v1
  #
  # could be baked into a production-style frontend build
  # and later cause the browser to call the wrong origin.
  #
  # Docker/release workflows may override this value for
  # their own environment.
  # --------------------------------------------------------

  VITE_API_URL: http://localhost:8000/api/v1

# ==========================================================
# CONCURRENCY
# ==========================================================

concurrency:
  group: finora-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ==========================================================
# PERMISSIONS
# ==========================================================

permissions:
  contents: read

# ==========================================================
# JOBS
# ==========================================================

jobs:
  # ========================================================
  # 1. BACKEND CHECK
  # ========================================================

  backend-check:
    name: Backend Check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "latest"
          enable-cache: true

      - name: Restore uv cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: >
            uv-${{ runner.os }}-
            py${{ env.PYTHON_VERSION }}-
            ${{ hashFiles('backend/uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-

      - name: Install backend dependencies
        working-directory: backend
        run: |
          uv sync --frozen

      - name: Verify uv lock
        working-directory: backend
        run: |
          uv lock --check

      - name: Verify backend imports
        working-directory: backend
        env:
          DB_TYPE: sqlite
        run: |
          uv run python -c "from src.app import app; print('Backend import successful')"

      - name: Ruff lint
        working-directory: backend
        run: |
          uv run ruff check src tests

      - name: Ruff format check
        working-directory: backend
        run: |
          uv run ruff format --check src tests

      - name: Black format check
        working-directory: backend
        run: |
          uv run black --check src tests

      - name: Run backend tests
        working-directory: backend
        env:
          DB_TYPE: sqlite
        run: |
          uv run pytest -v

      - name: Upload backend test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: finora-backend-artifacts
          path: |
            backend/.pytest_cache
            backend/htmlcov
            backend/*.log
          if-no-files-found: ignore

  # ========================================================
  # 2. POSTGRESQL INTEGRATION
  # ========================================================

  postgres-integration:
    name: PostgreSQL Integration
    runs-on: ubuntu-latest

    env:
      DB_TYPE: postgresql
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: finora
      POSTGRES_PASSWORD: password
      POSTGRES_DB: finance_db

    services:
      postgres:
        image: postgres:17-alpine

        env:
          POSTGRES_USER: finora
          POSTGRES_PASSWORD: password
          POSTGRES_DB: finance_db

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U finora -d finance_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 10s

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # PostgreSQL integration steps remain intentionally
      # explicit and can be expanded independently from the
      # Docker validation/release workflows.

  # ========================================================
  # 3. FRONTEND CHECK
  # ========================================================

  frontend-check:
    name: Frontend Check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          npm ci

      - name: ESLint
        working-directory: frontend
        run: |
          npm run lint

      - name: TypeScript
        working-directory: frontend
        run: |
          npx tsc --noEmit

      - name: Frontend production build
        working-directory: frontend
        env:
          VITE_API_URL: ${{ env.VITE_API_URL }}
        run: |
          echo "Frontend API URL: ${VITE_API_URL}"
          npm run build

      - name: Verify frontend build API configuration
        working-directory: frontend
        env:
          EXPECTED_API_URL: ${{ env.VITE_API_URL }}
        run: |
          echo "Checking frontend bundle for expected API URL..."

          if ! grep -R -F -q \
            "${EXPECTED_API_URL}" \
            dist/assets; then

            echo "::error::Expected VITE_API_URL was not found in the frontend build."
            echo "Expected: ${EXPECTED_API_URL}"
            exit 1
          fi

          echo "Frontend API URL is correctly embedded in the build."

      - name: Upload frontend build on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: finora-frontend-artifacts
          path: |
            frontend/dist
            frontend/node_modules/.cache
          if-no-files-found: ignore

# ==========================================================
# END
# ==========================================================
