# ==========================================================
# Finora - Continuous Integration
# ==========================================================
#
# CI Architecture
#
#   GitHub Actions
#        │
#        ▼
#   CI PostgreSQL Service
#        │
#        ▼
#   scripts/ci.sh
#        │
#        ├── Temporary .env.ci
#        │
#        ├── Backend validation
#        ├── PostgreSQL integration
#        ├── Alembic migrations
#        ├── Schema validation
#        ├── Frontend validation
#        └── Production build
#                 │
#                 ▼
#             CI PASSED
#
# IMPORTANT
#
#   This workflow is the execution environment for the CI quality gate.
#
#   The actual validation logic lives in:
#
#       scripts/ci.sh
#
#   Docker image validation is handled separately by:
#
#       .github/workflows/docker.yml
#
#   Release image validation/publishing is handled separately by:
#
#       .github/workflows/release.yml
#
#   The CI script creates a disposable .env.ci containing safe
#   integration-test values. It is deleted automatically when
#   scripts/ci.sh exits.
#
#   Local Docker Compose is NOT used by this workflow.
#
#   Local development continues to use:
#
#       .env
#       backend/.env
#       docker compose up
#
# ==========================================================

name: Finora CI

# ==========================================================
# TRIGGERS
# ==========================================================

on:
  push:
  pull_request:

# ==========================================================
# GLOBAL ENVIRONMENT
# ==========================================================

env:
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "22"

  # CI application environment is generated by scripts/ci.sh.
  # These values are intentionally not production credentials.
  APP_NAME: Finora
  DEBUG: "true"
  DB_TYPE: postgresql
  SECRET_KEY: ci-test-secret-key
  ALGORITHM: HS256
  ACCESS_TOKEN_EXPIRE_MINUTES: "60"

# ==========================================================
# CONCURRENCY
# ==========================================================

concurrency:
  group: finora-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ==========================================================
# PERMISSIONS
# ==========================================================

permissions:
  contents: read

# ==========================================================
# JOBS
# ==========================================================

jobs:
  # ========================================================
  # FINORA CI QUALITY GATE
  # ========================================================

  ci:
    name: Finora CI
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # ======================================================
    # ISOLATED POSTGRESQL SERVICE
    # ======================================================

    services:
      postgres:
        image: postgres:17-alpine

        env:
          POSTGRES_USER: finora
          POSTGRES_PASSWORD: password
          POSTGRES_DB: finance_db

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U finora -d finance_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 10s

    steps:
      # ====================================================
      # CHECKOUT
      # ====================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ====================================================
      # PYTHON
      # ====================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # ====================================================
      # UV
      # ====================================================

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "latest"
          enable-cache: true

      # ====================================================
      # NODE
      # ====================================================

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # ====================================================
      # VERIFY TOOLCHAIN
      # ====================================================

      - name: Verify CI toolchain
        run: |
          python --version
          uv --version
          node --version
          npm --version

      # ====================================================
      # VERIFY CI SCRIPT
      # ====================================================

      - name: Verify CI script
        run: |
          test -f scripts/ci.sh
          test -x scripts/ci.sh || chmod +x scripts/ci.sh

      # ====================================================
      # RUN COMPLETE CI QUALITY GATE
      # ====================================================
      #
      # scripts/ci.sh is responsible for:
      #
      #   - temporary .env.ci generation
      #   - backend dependencies
      #   - imports
      #   - Ruff
      #   - Black
      #   - pytest
      #   - PostgreSQL connectivity
      #   - Alembic migrations
      #   - schema validation
      #   - frontend dependencies
      #   - ESLint
      #   - frontend build
      #
      # ====================================================

      - name: Run Finora CI
        env:
          # Database service consumed by scripts/ci.sh
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_USER: finora
          POSTGRES_PASSWORD: password
          POSTGRES_DB: finance_db

        run: |
          ./scripts/ci.sh

      # ====================================================
      # UPLOAD DIAGNOSTIC ARTIFACTS ON FAILURE
      # ====================================================

      - name: Upload CI diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: finora-ci-diagnostics
          path: |
            backend/.pytest_cache
            backend/htmlcov
            backend/*.log
            frontend/dist
            frontend/node_modules/.cache
          if-no-files-found: ignore

# ==========================================================
# END
# ==========================================================
