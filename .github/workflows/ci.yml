# ==========================================================
# Finora - Continuous Integration
# ==========================================================
#
# Validates:
#   1. Backend
#   2. Frontend
#   3. PostgreSQL integration
#
# Trigger:
#   - Every push
#   - Every pull request
#
# Deployment and Docker image publishing are handled
# by separate workflows.
# ==========================================================

name: Finora CI


# ==========================================================
# TRIGGERS
# ==========================================================

on:
  push:

  pull_request:


# ==========================================================
# GLOBAL ENVIRONMENT
# ==========================================================

env:
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "22"


# ==========================================================
# CONCURRENCY
# ==========================================================

concurrency:
  group: finora-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


# ==========================================================
# PERMISSIONS
# ==========================================================

permissions:
  contents: read


# ==========================================================
# JOBS
# ==========================================================

jobs:

  # ========================================================
  # BACKEND VALIDATION
  # ========================================================

  backend:

    name: Backend Validation

    runs-on: ubuntu-latest

    timeout-minutes: 15

    env:
      APP_NAME: "Finora"
      DEBUG: "false"

      DB_TYPE: "sqlite"
      SQLITE_DB_PATH: "./finance.db"

      SECRET_KEY: "ci-test-secret-key"
      ALGORITHM: "HS256"
      ACCESS_TOKEN_EXPIRE_MINUTES: "60"

      BACKEND_CORS_ORIGINS: '["http://localhost"]'


    steps:

      # ----------------------------------------------------
      # Checkout
      # ----------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # ----------------------------------------------------
      # Python
      # ----------------------------------------------------

      - name: Set up Python
        uses: actions/setup-python@v5

        with:
          python-version: ${{ env.PYTHON_VERSION }}


      # ----------------------------------------------------
      # Install uv
      # ----------------------------------------------------

      - name: Install uv
        uses: astral-sh/setup-uv@v6

        with:
          version: "latest"
          enable-cache: true


      # ----------------------------------------------------
      # Install backend dependencies
      # ----------------------------------------------------

      - name: Install backend dependencies
        working-directory: backend

        run: |
          uv sync --frozen


      # ----------------------------------------------------
      # Backend import validation
      # ----------------------------------------------------

      - name: Validate backend imports
        working-directory: backend

        run: |
          uv run python -c "
          from src.app import app
          from src.core.config import settings
          from src.db.database import Base

          print('Backend imports: OK')
          print('FastAPI application: OK')
          print('Database metadata: OK')
          print(f'Application: {settings.APP_NAME}')
          print(f'Database type: {settings.DB_TYPE}')
          "


      # ----------------------------------------------------
      # Backend tests
      # ----------------------------------------------------

      - name: Run backend tests
        working-directory: backend

        run: |
          uv run pytest -v


      # ----------------------------------------------------
      # Alembic migration consistency
      # ----------------------------------------------------

      - name: Validate Alembic migrations
        working-directory: backend

        run: |
          uv run alembic check


  # ========================================================
  # FRONTEND VALIDATION
  # ========================================================

  frontend:

    name: Frontend Validation

    runs-on: ubuntu-latest

    timeout-minutes: 15

    env:
      VITE_API_URL: "/api/v1"


    steps:

      # ----------------------------------------------------
      # Checkout
      # ----------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # ----------------------------------------------------
      # Node.js
      # ----------------------------------------------------

      - name: Set up Node.js
        uses: actions/setup-node@v4

        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json


      # ----------------------------------------------------
      # Install dependencies
      # ----------------------------------------------------

      - name: Install frontend dependencies
        working-directory: frontend

        run: |
          npm ci


      # ----------------------------------------------------
      # Lint
      # ----------------------------------------------------

      - name: Run ESLint
        working-directory: frontend

        run: |
          npm run lint


      # ----------------------------------------------------
      # Production build
      # ----------------------------------------------------

      - name: Build frontend
        working-directory: frontend

        run: |
          npm run build


  # ========================================================
  # POSTGRESQL INTEGRATION
  # ========================================================

  integration:

    name: PostgreSQL Integration

    runs-on: ubuntu-latest

    timeout-minutes: 20

    needs:
      - backend

    env:
      APP_NAME: "Finora"
      DEBUG: "false"

      DB_TYPE: "postgresql"

      POSTGRES_USER: "finora"
      POSTGRES_PASSWORD: "password"
      POSTGRES_HOST: "localhost"
      POSTGRES_PORT: "5432"
      POSTGRES_DB: "finance_db"

      SECRET_KEY: "ci-test-secret-key"
      ALGORITHM: "HS256"
      ACCESS_TOKEN_EXPIRE_MINUTES: "60"

      BACKEND_CORS_ORIGINS: '["http://localhost"]'


    services:

      # ----------------------------------------------------
      # PostgreSQL
      # ----------------------------------------------------

      postgres:

        image: postgres:17-alpine

        env:
          POSTGRES_USER: finora
          POSTGRES_PASSWORD: password
          POSTGRES_DB: finance_db

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U finora -d finance_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10


    steps:

      # ----------------------------------------------------
      # Checkout
      # ----------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # ----------------------------------------------------
      # Python
      # ----------------------------------------------------

      - name: Set up Python
        uses: actions/setup-python@v5

        with:
          python-version: ${{ env.PYTHON_VERSION }}


      # ----------------------------------------------------
      # Install uv
      # ----------------------------------------------------

      - name: Install uv
        uses: astral-sh/setup-uv@v6

        with:
          version: "latest"
          enable-cache: true


      # ----------------------------------------------------
      # Install backend dependencies
      # ----------------------------------------------------

      - name: Install backend dependencies
        working-directory: backend

        run: |
          uv sync --frozen


      # ----------------------------------------------------
      # Run migrations
      # ----------------------------------------------------

      - name: Run PostgreSQL migrations
        working-directory: backend

        run: |
          uv run alembic upgrade head


      # ----------------------------------------------------
      # Verify migration state
      # ----------------------------------------------------

      - name: Verify migration state
        working-directory: backend

        run: |
          uv run alembic current


      # ----------------------------------------------------
      # Verify PostgreSQL schema
      # ----------------------------------------------------

      - name: Verify PostgreSQL schema
        working-directory: backend

        run: |
          uv run python -c "
          from sqlalchemy import create_engine, inspect
          from src.db.database import DATABASE_URL

          engine = create_engine(DATABASE_URL)

          inspector = inspect(engine)

          tables = set(
              inspector.get_table_names()
          )

          print('PostgreSQL tables:')

          for table in sorted(tables):
              print(f' - {table}')

          required = {
              'users',
              'categories',
              'transactions',
              'budgets',
          }

          missing = required - tables

          if missing:
              raise RuntimeError(
                  f'Missing required tables: {sorted(missing)}'
              )

          print('PostgreSQL schema validation: OK')
          "


      # ----------------------------------------------------
      # Verify critical columns
      # ----------------------------------------------------

      - name: Verify PostgreSQL columns
        working-directory: backend

        run: |
          uv run python -c "
          from sqlalchemy import create_engine, inspect
          from src.db.database import DATABASE_URL

          engine = create_engine(DATABASE_URL)

          inspector = inspect(engine)

          expected_columns = {
              'users': {
                  'id',
                  'name',
                  'email',
                  'password_hash',
                  'is_active',
                  'created_at',
              },
              'categories': {
                  'id',
                  'name',
                  'type',
                  'user_id',
                  'created_at',
              },
              'transactions': {
                  'id',
                  'amount',
                  'type',
                  'description',
                  'date',
                  'user_id',
                  'category_id',
                  'created_at',
              },
              'budgets': {
                  'id',
                  'amount',
                  'month',
                  'year',
                  'user_id',
                  'category_id',
                  'created_at',
              },
          }

          for table, expected in expected_columns.items():

              actual = {
                  column['name']
                  for column in inspector.get_columns(table)
              }

              missing = expected - actual

              if missing:
                  raise RuntimeError(
                      f'{table} is missing columns: '
                      f'{sorted(missing)}'
                  )

              print(
                  f'{table}: column validation OK'
              )

          print(
              'PostgreSQL column validation: OK'
          )
          "


      # ----------------------------------------------------
      # Start backend
      # ----------------------------------------------------

      - name: Start backend
        working-directory: backend

        run: |
          uv run uvicorn src.app:app \
            --host 127.0.0.1 \
            --port 8000 \
            > backend.log 2>&1 &

          echo $! > backend.pid


      # ----------------------------------------------------
      # Wait for backend
      # ----------------------------------------------------

      - name: Wait for backend
        run: |
          for i in {1..30}; do

            if curl \
              --fail \
              --silent \
              http://127.0.0.1:8000/api/v1/health; then

              echo
              echo "Backend is healthy."

              exit 0

            fi

            echo "Waiting for backend..."

            sleep 2

          done

          echo
          echo "Backend failed to become healthy."
          echo

          cat backend/backend.log || true

          exit 1


      # ----------------------------------------------------
      # API health validation
      # ----------------------------------------------------

      - name: Validate API health
        run: |
          curl \
            --fail \
            --show-error \
            http://127.0.0.1:8000/api/v1/health


      # ----------------------------------------------------
      # API smoke test
      # ----------------------------------------------------

      - name: Run API smoke test
        run: |
          curl \
            --fail \
            --show-error \
            --request GET \
            http://127.0.0.1:8000/api/v1/health


      # ----------------------------------------------------
      # Backend logs on failure
      # ----------------------------------------------------

      - name: Upload backend logs
        if: failure()
        uses: actions/upload-artifact@v4

        with:
          name: finora-backend-logs
          path: backend/backend.log
          if-no-files-found: ignore


      # ----------------------------------------------------
      # Cleanup
      # ----------------------------------------------------

      - name: Stop backend
        if: always()
        working-directory: backend

        run: |
          if [ -f backend.pid ]; then
            kill "$(cat backend.pid)" || true
          fi

