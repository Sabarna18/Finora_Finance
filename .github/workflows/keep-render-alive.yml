# ============================================================
# Finora — Render Keep-Alive
# ============================================================
#
# Purpose:
#   Generate periodic external HTTP activity against the
#   Render-hosted Finora backend.
#
# This workflow:
#   - Does NOT build Docker images
#   - Does NOT deploy Finora
#   - Does NOT modify the database
#   - Does NOT modify application code
#   - Does NOT depend on the Finora container being alive
#
# It simply requests the backend health endpoint periodically.
#
# Required GitHub Secret:
#
#   RENDER_BACKEND_URL
#
# Example:
#
#   https://finora-backend.onrender.com
#
# The workflow appends:
#
#   /api/v1/health
#
# ============================================================

name: Keep Render Alive

on:
  schedule:
    # Run every 10 minutes.
    #
    # GitHub Actions scheduled workflows are not guaranteed
    # to execute at the exact second specified.
    - cron: "*/10 * * * *"

  # Allows manual testing from:
  # GitHub → Actions → Keep Render Alive → Run workflow
  workflow_dispatch:

jobs:
  keep-alive:
    name: Ping Render Backend
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------------
      # 1. Validate configuration
      # --------------------------------------------------------

      - name: Validate Render URL
        env:
          RENDER_BACKEND_URL: ${{ secrets.RENDER_BACKEND_URL }}
        run: |
          set -euo pipefail

          if [ -z "${RENDER_BACKEND_URL:-}" ]; then
            echo "❌ RENDER_BACKEND_URL secret is not configured."
            exit 1
          fi

          case "$RENDER_BACKEND_URL" in
            http://*|https://*)
              ;;
            *)
              echo "❌ RENDER_BACKEND_URL must start with http:// or https://"
              exit 1
              ;;
          esac

          echo "✓ Render backend URL configured"

      # --------------------------------------------------------
      # 2. Ping backend
      # --------------------------------------------------------

      - name: Ping Finora Health Endpoint
        env:
          RENDER_BACKEND_URL: ${{ secrets.RENDER_BACKEND_URL }}
        run: |
          set -euo pipefail

          HEALTH_URL="${RENDER_BACKEND_URL%/}/api/v1/health"

          echo ""
          echo "=================================================="
          echo "  Finora Render Keep-Alive"
          echo "=================================================="
          echo ""
          echo "→ Target: ${HEALTH_URL}"
          echo "→ Time: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo ""

          START_TIME=$(date +%s%3N)

          HTTP_STATUS=$(
            curl \
              --silent \
              --show-error \
              --output /tmp/finora-health-response.json \
              --write-out "%{http_code}" \
              --max-time 30 \
              --connect-timeout 10 \
              "$HEALTH_URL"
          )

          END_TIME=$(date +%s%3N)
          RESPONSE_TIME=$((END_TIME - START_TIME))

          echo "→ HTTP status: ${HTTP_STATUS}"
          echo "→ Response time: ${RESPONSE_TIME} ms"

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo ""
            echo "✓ Finora backend is responding"
            echo "✓ Render activity generated successfully"
            echo ""

            if [ -s /tmp/finora-health-response.json ]; then
              echo "Health response:"
              cat /tmp/finora-health-response.json
              echo ""
            fi

            echo "=================================================="
            echo "  Keep-alive completed successfully"
            echo "=================================================="

          else
            echo ""
            echo "❌ Finora backend returned HTTP ${HTTP_STATUS}"
            echo ""
            echo "Response:"
            cat /tmp/finora-health-response.json 2>/dev/null || true
            echo ""

            exit 1
          fi

