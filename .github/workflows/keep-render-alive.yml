# ============================================================
# Finora — Render Keep-Alive
# ============================================================
#
# Purpose:
#   Generate periodic external inbound traffic to the
#   Render-hosted Finora backend.
#
# Behavior:
#   - Runs automatically approximately every 10 minutes
#   - First request can wake a sleeping Render service
#   - Curl failures are captured instead of terminating the job
#   - Retries during Render cold-start
#   - Waits for the backend to actually become healthy
#   - Fails only after all recovery attempts are exhausted
#
# Required GitHub Secret:
#
#   RENDER_BACKEND_URL
#
# Example:
#
#   https://finora-backend.onrender.com
#
# Health endpoint:
#
#   /api/v1/health
#
# ============================================================

name: Finora Render Keep-Alive

on:
  schedule:
    # Approximately every 10 minutes.
    #
    # Offset from the exact hour boundaries to reduce the
    # likelihood of GitHub Actions scheduling delays.
    - cron: "7,17,27,37,47,57 * * * *"

  # Manual execution remains available for diagnostics.
  workflow_dispatch:

# ============================================================
# Prevent overlapping keep-alive executions.
# ============================================================

concurrency:
  group: finora-render-keep-alive
  cancel-in-progress: false

jobs:
  keep-alive:
    name: Wake and Verify Render Backend
    runs-on: ubuntu-latest

    steps:

      # ========================================================
      # 1. Validate configuration
      # ========================================================

      - name: Validate Render Configuration
        env:
          RENDER_BACKEND_URL: ${{ secrets.RENDER_BACKEND_URL }}

        run: |
          set -euo pipefail

          echo ""
          echo "=================================================="
          echo "  Finora Render Keep-Alive"
          echo "=================================================="
          echo ""

          if [ -z "${RENDER_BACKEND_URL:-}" ]; then
            echo "❌ RENDER_BACKEND_URL secret is not configured."
            exit 1
          fi

          case "$RENDER_BACKEND_URL" in
            http://*|https://*)
              ;;
            *)
              echo "❌ RENDER_BACKEND_URL must start with http:// or https://"
              exit 1
              ;;
          esac

          echo "✓ Render backend URL configured"
          echo "✓ Automatic scheduling enabled"
          echo ""

      # ========================================================
      # 2. Wake Render and verify backend
      # ========================================================

      - name: Wake and Verify Finora Backend
        env:
          RENDER_BACKEND_URL: ${{ secrets.RENDER_BACKEND_URL }}

        run: |
          # GitHub executes the shell with -e.
          #
          # We intentionally disable -e for this step because
          # curl failures are EXPECTED during a Render cold start.
          #
          # We manually capture curl's exit code and decide
          # whether to retry or fail.

          set +e
          set -u

          HEALTH_URL="${RENDER_BACKEND_URL%/}/api/v1/health"

          # ----------------------------------------------------
          # Retry configuration
          # ----------------------------------------------------

          MAX_ATTEMPTS=12
          WAIT_SECONDS=30

          CONNECT_TIMEOUT=10
          REQUEST_TIMEOUT=45

          echo ""
          echo "=================================================="
          echo "  Finora Render Wake Sequence"
          echo "=================================================="
          echo ""

          echo "→ Target:"
          echo "  ${HEALTH_URL}"
          echo ""

          echo "→ Execution:"
          echo "  Automatic scheduled keep-alive"
          echo ""

          echo "→ Recovery configuration:"
          echo "  Maximum attempts : ${MAX_ATTEMPTS}"
          echo "  Request timeout  : ${REQUEST_TIMEOUT}s"
          echo "  Retry interval   : ${WAIT_SECONDS}s"
          echo ""

          SUCCESS=false

          # ====================================================
          # Retry loop
          # ====================================================

          for ATTEMPT in $(seq 1 "$MAX_ATTEMPTS"); do

            echo ""
            echo "--------------------------------------------------"
            echo "  Attempt ${ATTEMPT}/${MAX_ATTEMPTS}"
            echo "--------------------------------------------------"
            echo ""

            RESPONSE_FILE="/tmp/finora-health-${ATTEMPT}.json"
            ERROR_FILE="/tmp/finora-curl-error-${ATTEMPT}.log"

            rm -f "$RESPONSE_FILE"
            rm -f "$ERROR_FILE"

            START_TIME=$(date +%s%3N)

            # --------------------------------------------------
            # IMPORTANT:
            #
            # Do NOT allow curl exit code 28 to terminate the
            # workflow.
            #
            # curl runs inside an explicit if statement so its
            # failure becomes data rather than a shell failure.
            # --------------------------------------------------

            HTTP_STATUS=""

            if HTTP_STATUS=$(
              curl \
                --silent \
                --show-error \
                --output "$RESPONSE_FILE" \
                --write-out "%{http_code}" \
                --connect-timeout "$CONNECT_TIMEOUT" \
                --max-time "$REQUEST_TIMEOUT" \
                "$HEALTH_URL" \
                2>"$ERROR_FILE"
            ); then

              CURL_EXIT_CODE=0

            else

              CURL_EXIT_CODE=$?

            fi

            END_TIME=$(date +%s%3N)
            RESPONSE_TIME=$((END_TIME - START_TIME))

            # --------------------------------------------------
            # Normalize HTTP status
            # --------------------------------------------------

            if [ -z "$HTTP_STATUS" ]; then
              HTTP_STATUS="000"
            fi

            echo "→ Curl exit code : ${CURL_EXIT_CODE}"
            echo "→ HTTP status    : ${HTTP_STATUS}"
            echo "→ Response time  : ${RESPONSE_TIME} ms"

            # ==================================================
            # SUCCESS
            # ==================================================

            if [ "$CURL_EXIT_CODE" -eq 0 ] \
              && [ "$HTTP_STATUS" -ge 200 ] \
              && [ "$HTTP_STATUS" -lt 300 ]; then

              echo ""
              echo "✓ Finora backend is awake."
              echo "✓ Health endpoint responded successfully."
              echo "✓ Render activity confirmed."
              echo ""

              if [ -s "$RESPONSE_FILE" ]; then
                echo "Health response:"
                cat "$RESPONSE_FILE"
                echo ""
              fi

              SUCCESS=true
              break

            fi

            # ==================================================
            # FAILURE / COLD START
            # ==================================================

            echo ""

            if [ "$CURL_EXIT_CODE" -eq 28 ]; then

              echo "⚠ Request timed out (curl 28)."
              echo "→ Render may still be waking from a cold state."

            elif [ "$CURL_EXIT_CODE" -eq 6 ]; then

              echo "⚠ DNS resolution failed."
              echo "→ Render hostname could not be resolved."

            elif [ "$CURL_EXIT_CODE" -eq 7 ]; then

              echo "⚠ Connection failed."
              echo "→ Render service may still be starting."

            elif [ "$CURL_EXIT_CODE" -ne 0 ]; then

              echo "⚠ HTTP request failed."
              echo "→ Curl exit code: ${CURL_EXIT_CODE}"

            else

              echo "⚠ Backend returned an unsuccessful HTTP status."
              echo "→ HTTP status: ${HTTP_STATUS}"

            fi

            if [ -s "$ERROR_FILE" ]; then
              echo ""
              echo "→ Curl message:"
              cat "$ERROR_FILE"
            fi

            if [ -s "$RESPONSE_FILE" ]; then
              echo ""
              echo "→ Response body:"
              cat "$RESPONSE_FILE"
            fi

            # ==================================================
            # RETRY
            # ==================================================

            if [ "$ATTEMPT" -lt "$MAX_ATTEMPTS" ]; then

              echo ""
              echo "→ Waiting ${WAIT_SECONDS}s before retry..."
              echo "→ Render will continue receiving recovery attempts."

              sleep "$WAIT_SECONDS"

            fi

          done

          # ====================================================
          # Final result
          # ====================================================

          echo ""
          echo "=================================================="

          if [ "$SUCCESS" = true ]; then

            echo "  ✓ KEEP-ALIVE SUCCESSFUL"
            echo "=================================================="
            echo ""

            echo "Finora backend is responding."
            echo "Render activity was successfully generated."
            echo ""

            echo "Completed:"
            echo "  $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo ""

            exit 0

          fi

          # ====================================================
          # Complete failure
          # ====================================================

          echo "  ❌ KEEP-ALIVE FAILED"
          echo "=================================================="
          echo ""

          echo "Render did not return a successful health response"
          echo "after ${MAX_ATTEMPTS} attempts."
          echo ""

          echo "The scheduled keep-alive could not verify that"
          echo "the Finora backend became available."
          echo ""

          echo "Possible causes:"
          echo "  • Render service unavailable"
          echo "  • Backend startup failure"
          echo "  • Render cold start exceeded recovery window"
          echo "  • Health endpoint unavailable"
          echo "  • DNS/network problem"
          echo "  • Deployment/startup failure"
          echo ""

          exit 1

