# ============================================================
# Finora — Render Keep-Alive
# ============================================================
#
# Purpose:
#   Generate periodic external inbound traffic to the
#   Render-hosted Finora backend.
#
# Behavior:
#   - Runs every 10 minutes
#   - Can also be triggered manually
#   - Calls the FastAPI health endpoint
#   - Retries after a timeout / connection failure
#   - Gives Render time to wake from a cold start
#   - Reports response time and HTTP status
#
# Required GitHub Secret:
#
#   RENDER_BACKEND_URL
#
# Example:
#
#   https://finora-backend.onrender.com
#
# The workflow automatically appends:
#
#   /api/v1/health
#
# ============================================================

name: Finora Render Keep-Alive

on:
  schedule:
    # External activity every 10 minutes.
    - cron: "*/10 * * * *"

  # Manual test / execution.
  workflow_dispatch:

jobs:
  keep-alive:
    name: Keep Render Backend Awake
    runs-on: ubuntu-latest

    steps:

      # ========================================================
      # 1. Validate configuration
      # ========================================================

      - name: Validate Render Configuration
        env:
          RENDER_BACKEND_URL: ${{ secrets.RENDER_BACKEND_URL }}

        run: |
          set -euo pipefail

          echo ""
          echo "=================================================="
          echo "  Finora Render Keep-Alive"
          echo "=================================================="
          echo ""

          if [ -z "${RENDER_BACKEND_URL:-}" ]; then
            echo "❌ RENDER_BACKEND_URL secret is not configured."
            exit 1
          fi

          case "$RENDER_BACKEND_URL" in
            http://*|https://*)
              ;;
            *)
              echo "❌ RENDER_BACKEND_URL must start with http:// or https://"
              exit 1
              ;;
          esac

          echo "✓ Render backend URL configured"
          echo ""

      # ========================================================
      # 2. Ping Render with retry / cold-start tolerance
      # ========================================================

      - name: Ping Finora Backend
        env:
          RENDER_BACKEND_URL: ${{ secrets.RENDER_BACKEND_URL }}

        run: |
          set -u

          HEALTH_URL="${RENDER_BACKEND_URL%/}/api/v1/health"

          MAX_ATTEMPTS=4
          WAIT_SECONDS=30
          CONNECT_TIMEOUT=10
          REQUEST_TIMEOUT=45

          echo "→ Target: ${HEALTH_URL}"
          echo "→ Started: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo ""
          echo "→ Maximum attempts: ${MAX_ATTEMPTS}"
          echo "→ Retry delay: ${WAIT_SECONDS}s"
          echo ""

          SUCCESS=false

          for ATTEMPT in $(seq 1 "$MAX_ATTEMPTS"); do

            echo "--------------------------------------------------"
            echo "  Attempt ${ATTEMPT}/${MAX_ATTEMPTS}"
            echo "--------------------------------------------------"
            echo ""

            RESPONSE_FILE="/tmp/finora-health-${ATTEMPT}.json"

            START_TIME=$(date +%s%3N)

            HTTP_STATUS=$(
              curl \
                --silent \
                --show-error \
                --output "$RESPONSE_FILE" \
                --write-out "%{http_code}" \
                --connect-timeout "$CONNECT_TIMEOUT" \
                --max-time "$REQUEST_TIMEOUT" \
                "$HEALTH_URL" \
                2>/tmp/finora-curl-error.log
            )

            CURL_EXIT_CODE=$?

            END_TIME=$(date +%s%3N)
            RESPONSE_TIME=$((END_TIME - START_TIME))

            echo "→ Curl exit code: ${CURL_EXIT_CODE}"
            echo "→ HTTP status: ${HTTP_STATUS:-none}"
            echo "→ Response time: ${RESPONSE_TIME} ms"

            if [ "$CURL_EXIT_CODE" -eq 0 ] \
              && [ "$HTTP_STATUS" -ge 200 ] \
              && [ "$HTTP_STATUS" -lt 300 ]; then

              echo ""
              echo "✓ Finora backend responded successfully."
              echo "✓ Render activity generated."
              echo ""

              if [ -s "$RESPONSE_FILE" ]; then
                echo "Health response:"
                cat "$RESPONSE_FILE"
                echo ""
              fi

              SUCCESS=true
              break
            fi

            echo ""

            if [ -s /tmp/finora-curl-error.log ]; then
              echo "→ Request error:"
              cat /tmp/finora-curl-error.log
              echo ""
            fi

            if [ "$ATTEMPT" -lt "$MAX_ATTEMPTS" ]; then
              echo "⚠ Backend did not respond successfully."
              echo "→ Render may be starting from a cold state."
              echo "→ Waiting ${WAIT_SECONDS}s before retry..."
              echo ""

              sleep "$WAIT_SECONDS"
            fi

          done

          echo ""
          echo "=================================================="

          if [ "$SUCCESS" = true ]; then
            echo "  ✓ KEEP-ALIVE SUCCESSFUL"
            echo "=================================================="
            echo ""
            echo "Finora received external activity successfully."
            exit 0
          fi

          echo "  ❌ KEEP-ALIVE FAILED"
          echo "=================================================="
          echo ""
          echo "Render did not return a successful health response"
          echo "after ${MAX_ATTEMPTS} attempts."
          echo ""
          echo "This may indicate:"
          echo "  • Render is unavailable"
          echo "  • Backend failed to start"
          echo "  • Health endpoint is unavailable"
          echo "  • Network connectivity problem"
          echo "  • Render cold start exceeded the retry window"
          echo ""

          exit 1

