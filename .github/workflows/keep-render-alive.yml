# ============================================================
# Finora — Render Keep-Alive
# ============================================================
#
# Purpose:
#   Keep the Render-hosted Finora backend active by generating
#   periodic external HTTP traffic.
#
# Behavior:
#   - Automatically runs from GitHub's scheduler
#   - No manual trigger required
#   - Runs approximately every 10 minutes
#   - Uses an offset schedule to avoid exact hour boundaries
#   - First request can wake a sleeping Render service
#   - Retries while Render performs a cold start
#   - Waits up to ~12 minutes for the service to recover
#   - Reports HTTP status and response time
#
# Required GitHub Secret:
#
#   RENDER_BACKEND_URL
#
# Example:
#
#   https://finora-backend.onrender.com
#
# The workflow automatically appends:
#
#   /api/v1/health
#
# ============================================================

name: Finora Render Keep-Alive

on:
  schedule:
    # Approximately every 10 minutes.
    #
    # The offset from :00/:10/:20/... is intentional.
    # GitHub scheduled workflows can experience delays around
    # high-load periods, particularly at the start of an hour.
    - cron: "7,17,27,37,47,57 * * * *"

  # Manual execution remains available for diagnostics.
  workflow_dispatch:

# ============================================================
# Prevent delayed executions from stacking up.
# ============================================================

concurrency:
  group: finora-render-keep-alive
  cancel-in-progress: false

jobs:
  keep-alive:
    name: Wake and Verify Render Backend
    runs-on: ubuntu-latest

    steps:

      # ========================================================
      # 1. Validate configuration
      # ========================================================

      - name: Validate Render Configuration
        env:
          RENDER_BACKEND_URL: ${{ secrets.RENDER_BACKEND_URL }}

        run: |
          set -euo pipefail

          echo ""
          echo "=================================================="
          echo "  Finora Render Keep-Alive"
          echo "=================================================="
          echo ""

          if [ -z "${RENDER_BACKEND_URL:-}" ]; then
            echo "❌ RENDER_BACKEND_URL secret is not configured."
            exit 1
          fi

          case "$RENDER_BACKEND_URL" in
            http://*|https://*)
              ;;
            *)
              echo "❌ RENDER_BACKEND_URL must start with http:// or https://"
              exit 1
              ;;
          esac

          echo "✓ Render backend URL configured"
          echo "✓ Automatic scheduled execution enabled"
          echo ""

      # ========================================================
      # 2. Wake Render and wait for readiness
      # ========================================================

      - name: Wake and Verify Finora Backend
        env:
          RENDER_BACKEND_URL: ${{ secrets.RENDER_BACKEND_URL }}

        run: |
          set -u

          HEALTH_URL="${RENDER_BACKEND_URL%/}/api/v1/health"

          # ----------------------------------------------------
          # Cold-start strategy
          #
          # 12 attempts × 45 seconds maximum request time
          # + 30 second waits between attempts
          #
          # This provides a large recovery window without
          # keeping the GitHub runner alive indefinitely.
          # ----------------------------------------------------

          MAX_ATTEMPTS=12
          WAIT_SECONDS=30
          CONNECT_TIMEOUT=10
          REQUEST_TIMEOUT=45

          echo ""
          echo "=================================================="
          echo "  Finora Render Wake Sequence"
          echo "=================================================="
          echo ""

          echo "→ Target:"
          echo "  ${HEALTH_URL}"
          echo ""

          echo "→ Schedule:"
          echo "  Automatic — approximately every 10 minutes"
          echo ""

          echo "→ Cold-start recovery:"
          echo "  Maximum attempts : ${MAX_ATTEMPTS}"
          echo "  Request timeout  : ${REQUEST_TIMEOUT}s"
          echo "  Retry interval   : ${WAIT_SECONDS}s"
          echo ""

          SUCCESS=false

          for ATTEMPT in $(seq 1 "$MAX_ATTEMPTS"); do

            echo ""
            echo "--------------------------------------------------"
            echo "  Attempt ${ATTEMPT}/${MAX_ATTEMPTS}"
            echo "--------------------------------------------------"

            RESPONSE_FILE="/tmp/finora-health-${ATTEMPT}.json"
            ERROR_FILE="/tmp/finora-curl-error-${ATTEMPT}.log"

            START_TIME=$(date +%s%3N)

            HTTP_STATUS=$(
              curl \
                --silent \
                --show-error \
                --output "$RESPONSE_FILE" \
                --write-out "%{http_code}" \
                --connect-timeout "$CONNECT_TIMEOUT" \
                --max-time "$REQUEST_TIMEOUT" \
                "$HEALTH_URL" \
                2>"$ERROR_FILE"
            )

            CURL_EXIT_CODE=$?

            END_TIME=$(date +%s%3N)
            RESPONSE_TIME=$((END_TIME - START_TIME))

            echo "→ Curl exit code : ${CURL_EXIT_CODE}"
            echo "→ HTTP status    : ${HTTP_STATUS:-none}"
            echo "→ Response time  : ${RESPONSE_TIME} ms"

            # --------------------------------------------------
            # Successful response
            # --------------------------------------------------

            if [ "$CURL_EXIT_CODE" -eq 0 ] \
              && [ "$HTTP_STATUS" -ge 200 ] \
              && [ "$HTTP_STATUS" -lt 300 ]; then

              echo ""
              echo "✓ Finora backend is awake."
              echo "✓ Health endpoint responded successfully."
              echo "✓ External Render activity confirmed."
              echo ""

              if [ -s "$RESPONSE_FILE" ]; then
                echo "Health response:"
                cat "$RESPONSE_FILE"
                echo ""
              fi

              SUCCESS=true
              break
            fi

            # --------------------------------------------------
            # Failed request
            # --------------------------------------------------

            echo ""

            if [ -s "$ERROR_FILE" ]; then
              echo "→ Request result:"
              cat "$ERROR_FILE"
              echo ""
            fi

            if [ -s "$RESPONSE_FILE" ]; then
              echo "→ Response body:"
              cat "$RESPONSE_FILE"
              echo ""
            fi

            # --------------------------------------------------
            # Retry
            # --------------------------------------------------

            if [ "$ATTEMPT" -lt "$MAX_ATTEMPTS" ]; then

              echo "⚠ Finora did not respond successfully."

              if [ "$ATTEMPT" -eq 1 ]; then
                echo "→ Render may be waking from an idle state."
              else
                echo "→ Waiting for Render/Finora to become ready."
              fi

              echo "→ Waiting ${WAIT_SECONDS}s before next attempt..."

              sleep "$WAIT_SECONDS"
            fi

          done

          # ====================================================
          # 3. Final result
          # ====================================================

          echo ""
          echo "=================================================="

          if [ "$SUCCESS" = true ]; then

            echo "  ✓ KEEP-ALIVE SUCCESSFUL"
            echo "=================================================="
            echo ""
            echo "Finora received external activity successfully."
            echo "Render service is responding."
            echo ""
            echo "Completed:"
            echo "  $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo ""

            exit 0
          fi

          echo "  ❌ KEEP-ALIVE FAILED"
          echo "=================================================="
          echo ""

          echo "Render did not return a successful health response"
          echo "within the configured recovery window."
          echo ""

          echo "Possible causes:"
          echo "  • Render service unavailable"
          echo "  • Backend failed during startup"
          echo "  • Cold start exceeded recovery window"
          echo "  • Health endpoint unavailable"
          echo "  • DNS/network problem"
          echo "  • Render deployment/startup failure"
          echo ""

          exit 1
