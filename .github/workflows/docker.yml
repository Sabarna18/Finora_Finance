# ============================================================
# Finora — Docker Validation
# ============================================================
#
# Purpose:
#   Validate the complete Docker application stack before
#   Docker images are published.
#
# Frontend API URL:
#
#   Supplied explicitly by this workflow.
#   scripts/docker.sh does not choose the API origin.
#
# ============================================================

name: Docker Validation

on:
  push:
    branches:
      - main
      - master
      - "feature/**"
    paths:
      - "backend/**"
      - "frontend/**"
      - "infrastructure/**"
      - "compose.yaml"
      - "compose.yml"
      - "docker-compose.yml"
      - "scripts/docker.sh"
      - ".dockerignore"
      - ".github/workflows/docker.yml"

  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "infrastructure/**"
      - "compose.yaml"
      - "compose.yml"
      - "docker-compose.yml"
      - "scripts/docker.sh"
      - ".dockerignore"
      - ".github/workflows/docker.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-docker:
    name: Validate Docker Stack
    runs-on: ubuntu-latest

    env:
      COMPOSE_PROJECT_NAME: finora-ci
      COMPOSE_FILE: compose.yml

      BACKEND_SERVICE: backend
      WEB_SERVICE: web

      WEB_PORT: 80

      # Validation stack contains both web and backend.
      # Release workflow overrides this with the Render API URL.
      VITE_API_URL: http://localhost:8000/api/v1

      HEALTH_PATH: /api/v1/health
      WEB_HEALTH_PATH: /web-health

      STARTUP_TIMEOUT: 120
      HEALTH_RETRIES: 30

      CI_ENV_FILE: backend/.env

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Docker environment
        run: |
          echo "============================================================"
          echo " Docker Environment"
          echo "============================================================"
          docker --version
          docker compose version
          echo
          echo "Docker environment is available."

      - name: Validate Docker script
        run: |
          echo "============================================================"
          echo " Docker Script Validation"
          echo "============================================================"

          if [[ ! -f scripts/docker.sh ]]; then
            echo "::error::scripts/docker.sh not found."
            exit 1
          fi

          chmod +x scripts/docker.sh
          bash -n scripts/docker.sh

          echo
          echo "Docker validation script exists."
          echo "Docker validation script syntax is valid."

      - name: Verify Compose file
        run: |
          echo "============================================================"
          echo " Compose File"
          echo "============================================================"

          if [[ ! -f "${COMPOSE_FILE}" ]]; then
            echo "::error::Compose file not found: ${COMPOSE_FILE}"
            exit 1
          fi

          echo "Compose file found: ${COMPOSE_FILE}"

      - name: Validate CI database secret
        env:
          CI_DATABASE_URL: ${{ secrets.FINORA_CI_DATABASE_URL }}
        run: |
          echo "============================================================"
          echo " CI Database Configuration"
          echo "============================================================"

          if [[ -z "${CI_DATABASE_URL}" ]]; then
            echo "::error::FINORA_CI_DATABASE_URL GitHub secret is not configured."
            exit 1
          fi

          echo "CI database secret is configured."
          echo "Database credentials will not be printed."

      - name: Validate complete Docker stack
        env:
          CI_DATABASE_URL: ${{ secrets.FINORA_CI_DATABASE_URL }}
        run: |
          echo "============================================================"
          echo " Finora Docker Validation"
          echo "============================================================"

          chmod +x scripts/docker.sh
          ./scripts/docker.sh

      - name: Collect Docker diagnostics
        if: failure()
        run: |
          echo "============================================================"
          echo " Docker Diagnostics"
          echo "============================================================"

          echo
          echo "------------------------------------------------------------"
          echo " Docker Containers"
          echo "------------------------------------------------------------"
          docker ps -a || true

          echo
          echo "------------------------------------------------------------"
          echo " Compose Status"
          echo "------------------------------------------------------------"
          docker compose -f "${COMPOSE_FILE}" ps -a || true

          echo
          echo "------------------------------------------------------------"
          echo " Compose Services"
          echo "------------------------------------------------------------"
          docker compose -f "${COMPOSE_FILE}" config --services || true

          echo
          echo "------------------------------------------------------------"
          echo " Compose Logs"
          echo "------------------------------------------------------------"
          docker compose -f "${COMPOSE_FILE}" logs --no-color --tail=200 || true

          echo
          echo "------------------------------------------------------------"
          echo " Backend Logs"
          echo "------------------------------------------------------------"
          docker compose -f "${COMPOSE_FILE}" logs --no-color --tail=200 backend || true

          echo
          echo "------------------------------------------------------------"
          echo " Web Logs"
          echo "------------------------------------------------------------"
          docker compose -f "${COMPOSE_FILE}" logs --no-color --tail=200 web || true

      - name: Docker cleanup
        if: always()
        run: |
          echo "============================================================"
          echo " Docker Cleanup"
          echo "============================================================"

          docker compose \
            -f "${COMPOSE_FILE}" \
            down \
            --volumes \
            --remove-orphans \
            || true

          rm -f "${CI_ENV_FILE}" || true

          echo
          echo "Docker cleanup completed."
