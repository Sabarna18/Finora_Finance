# ============================================================
# Finora — Docker Validation
#
# Purpose:
#   Validate and build the complete Docker stack before
#   Docker images are published.
# ============================================================

name: Docker Validation

# ============================================================
# TRIGGERS
# ============================================================

on:
  push:
    branches:
      - main
      - master
      - feature/**

    paths:
      - "backend/**"
      - "frontend/**"
      - "infrastructure/**"
      - "compose.yaml"
      - "compose.yml"
      - "docker-compose.yml"
      - "scripts/docker.sh"
      - ".dockerignore"
      - ".github/workflows/docker.yml"

  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "infrastructure/**"
      - "compose.yaml"
      - "compose.yml"
      - "docker-compose.yml"
      - "scripts/docker.sh"
      - ".dockerignore"
      - ".github/workflows/docker.yml"

  workflow_dispatch:

# ============================================================
# PERMISSIONS
# ============================================================

permissions:
  contents: read

# ============================================================
# CONCURRENCY
# ============================================================

concurrency:
  group: docker-validation-${{ github.workflow }}-${{ github.ref }}

  cancel-in-progress: true

# ============================================================
# JOB
# ============================================================

jobs:
  validate-docker:
    name: Validate Docker Stack

    runs-on: ubuntu-latest

    # --------------------------------------------------------
    # Environment
    # --------------------------------------------------------

    env:
      COMPOSE_PROJECT_NAME: finora-ci

      COMPOSE_FILE: compose.yml

      BACKEND_SERVICE: backend

      FRONTEND_SERVICE: frontend

      DATABASE_SERVICE: postgres

      BACKEND_PORT: 8000

      FRONTEND_PORT: 80

      HEALTH_PATH: /api/v1/health

    steps:
      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: Checkout repository

        uses: actions/checkout@v4

      # ======================================================
      # DOCKER VERSION
      # ======================================================

      - name: Check Docker

        run: |

          docker --version
          docker compose version

      # ======================================================
      # VALIDATE SCRIPT
      # ======================================================

      - name: Validate Docker script

        run: |

          test -f scripts/docker.sh

          chmod +x scripts/docker.sh

          bash -n scripts/docker.sh

      # ======================================================
      # DOCKER COMPOSE VALIDATION
      # ======================================================

      - name: Validate Compose configuration

        run: |

          docker compose \
            -f "${COMPOSE_FILE}" \
            config --quiet

      # ======================================================
      # BUILD + RUN + MIGRATE + HEALTH CHECK
      # ======================================================

      - name: Validate complete Docker stack

        run: |

          ./scripts/docker.sh

      # ======================================================
      # FAILURE DIAGNOSTICS
      # ======================================================

      - name: Collect Docker diagnostics

        if: failure()

        run: |

          echo "=============================================="
          echo "Docker containers"
          echo "=============================================="

          docker ps -a || true


          echo "=============================================="
          echo "Compose status"
          echo "=============================================="

          docker compose \
            -f "${COMPOSE_FILE}" \
            ps || true


          echo "=============================================="
          echo "Compose logs"
          echo "=============================================="

          docker compose \
            -f "${COMPOSE_FILE}" \
            logs \
            --no-color \
            --tail=200 \
            || true

      # ======================================================
      # FINAL CLEANUP
      # ======================================================

      - name: Docker cleanup

        if: always()

        run: |

          docker compose \
            -f "${COMPOSE_FILE}" \
            down \
            --volumes \
            --remove-orphans \
            || true

          docker system prune \
            -af \
            --volumes \
            || true
