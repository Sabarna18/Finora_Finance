# ==========================================================
# Finora - Docker Stack Validation
# ==========================================================
#
# Purpose:
#   Validate the complete local Docker application stack on GitHub
#   using the canonical Docker validation script.
#
# Architecture:
#
#   GitHub Actions
#        │
#        ├── Docker Engine
#        │
#        └── Docker Compose
#                │
#                ├── finora-web
#                │      └── React/Vite + Nginx
#                │
#                └── finora-backend
#                       └── FastAPI + Neon PostgreSQL
#
# IMPORTANT:
#
#   There is intentionally NO PostgreSQL container.
#
#   The Docker stack being validated is:
#
#       web       → Docker
#       backend   → Docker
#       database  → Neon PostgreSQL
#
#   All validation logic lives in:
#
#       scripts/docker.sh
#
#   This workflow is intentionally thin and only provides:
#
#       - GitHub Actions runner
#       - Docker
#       - repository checkout
#       - safe CI environment
#       - Docker stack execution
#
#   CI source validation is handled by:
#
#       .github/workflows/ci.yml
#
#   Release image publishing is handled by:
#
#       .github/workflows/release.yml
#
#   Deployment is handled separately.
#
# ==========================================================

name: Finora Docker Validation

# ==========================================================
# TRIGGERS
# ==========================================================

on:
  push:
  pull_request:

# ==========================================================
# GLOBAL ENVIRONMENT
# ==========================================================
#
# These are ONLY safe values required to validate the Docker
# application stack.
#
# No production credentials are stored here.
#
# The Docker validation script uses these values to construct
# the disposable runtime environment required by Compose.
#
# ==========================================================

env:
  VITE_API_URL: http://localhost:8000
  DEBUG: "true"

# ==========================================================
# CONCURRENCY
# ==========================================================

concurrency:
  group: finora-docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ==========================================================
# PERMISSIONS
# ==========================================================

permissions:
  contents: read

# ==========================================================
# JOBS
# ==========================================================

jobs:
  # ========================================================
  # DOCKER STACK VALIDATION
  # ========================================================

  docker-validation:
    name: Docker Stack Validation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # ====================================================
      # CHECKOUT
      # ====================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ====================================================
      # VERIFY DOCKER
      # ====================================================

      - name: Verify Docker environment
        run: |
          docker --version
          docker compose version
          docker info

      # ====================================================
      # VERIFY DOCKER FILES
      # ====================================================

      - name: Verify Docker project
        run: |
          test -f compose.yml
          test -f backend/Dockerfile
          test -f infrastructure/web/Dockerfile
          test -f infrastructure/web/nginx.conf
          test -f scripts/docker.sh

      # ====================================================
      # RUN CANONICAL DOCKER VALIDATION
      # ====================================================
      #
      # scripts/docker.sh performs the complete validation:
      #
      #   - Docker toolchain
      #   - project structure
      #   - local environment
      #   - Compose configuration
      #   - architecture
      #   - image builds
      #   - container startup
      #   - backend health
      #   - web health
      #   - frontend application
      #   - Vite API configuration
      #   - Docker healthchecks
      #
      # ====================================================

      - name: Validate Docker stack
        run: |
          chmod +x scripts/docker.sh
          ./scripts/docker.sh

      # ====================================================
      # FAILURE DIAGNOSTICS
      # ====================================================
      #
      # docker.sh already prints diagnostics on failure.
      # This step provides the final Compose state as well.
      #
      # ====================================================

      - name: Collect Docker diagnostics
        if: failure()
        run: |
          echo "============================================================"
          echo " Docker Compose Status"
          echo "============================================================"
          docker compose ps || true

          echo ""
          echo "============================================================"
          echo " Docker Images"
          echo "============================================================"
          docker images --format "table {{.Repository}}\t{{.Tag}}\t{{.Size}}" || true

          echo ""
          echo "============================================================"
          echo " Docker Volumes"
          echo "============================================================"
          docker volume ls || true

      # ====================================================
      # CLEANUP
      # ====================================================
      #
      # Always remove containers/networks/volumes created by
      # this workflow so the GitHub runner remains clean.
      #
      # ====================================================

      - name: Cleanup Docker stack
        if: always()
        run: |
          docker compose down --volumes --remove-orphans || true

# ==========================================================
# END
# ==========================================================
