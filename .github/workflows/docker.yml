# ==========================================================
# Finora - Docker Stack Validation
# ==========================================================
#
# Purpose:
#   Validate the complete Finora Docker application stack on GitHub
#   using the canonical scripts/docker.sh validation script.
#
# Runtime architecture under validation:
#
#   GitHub Actions runner
#          │
#          ├── PostgreSQL 17 service
#          │       │
#          │       └── disposable CI database
#          │
#          └── Docker Compose
#                  │
#                  ├── finora-web :80
#                  │      └── React/Vite + Nginx
#                  │
#                  └── finora-backend :8000
#                         └── FastAPI
#                                │
#                                ▼
#                       host.docker.internal:5432
#                                │
#                                ▼
#                       PostgreSQL CI service
#
# IMPORTANT:
#
#   The PostgreSQL service exists ONLY inside this GitHub Actions
#   validation workflow.
#
#   It does NOT modify compose.yml.
#
#   Local development remains:
#
#       web       → Docker
#       backend   → Docker
#       database  → Neon PostgreSQL
#
#   The workflow therefore validates the Docker application in an
#   isolated CI environment without ever touching production Neon.
#
#   scripts/docker.sh owns the Docker validation logic and creates
#   the temporary application environment consumed by Compose.
#
#   CI source validation:
#
#       .github/workflows/ci.yml
#
#   Release image publishing:
#
#       .github/workflows/release.yml
#
#   Deployment:
#
#       separate deployment workflow
#
# ==========================================================

name: Finora Docker Validation

# ==========================================================
# TRIGGERS
# ==========================================================

on:
  push:
  pull_request:

# ==========================================================
# GLOBAL ENVIRONMENT
# ==========================================================
#
# These values are safe, disposable Docker-validation values.
#
# The database values are repeated at the job level because the
# PostgreSQL service and scripts/docker.sh both need them.
#
# No production credentials are used.
#
# ==========================================================

env:
  VITE_API_URL: http://localhost:8000
  DEBUG: "true"

# ==========================================================
# CONCURRENCY
# ==========================================================

concurrency:
  group: finora-docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ==========================================================
# PERMISSIONS
# ==========================================================

permissions:
  contents: read

# ==========================================================
# JOBS
# ==========================================================

jobs:
  # ========================================================
  # DOCKER STACK VALIDATION
  # ========================================================

  docker-validation:
    name: Docker Stack Validation
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # ======================================================
    # TEMPORARY GITHUB ACTIONS POSTGRESQL
    # ======================================================
    #
    # This is NOT part of Finora's compose.yml.
    #
    # It exists only to give the Dockerized backend an isolated
    # PostgreSQL instance during GitHub validation.
    #
    # ======================================================

    services:
      postgres:
        image: postgres:17-alpine

        env:
          POSTGRES_USER: finora
          POSTGRES_PASSWORD: password
          POSTGRES_DB: finance_db

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U finora -d finance_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 10s

    # ======================================================
    # JOB ENVIRONMENT
    # ======================================================

    env:
      POSTGRES_HOST: host.docker.internal
      POSTGRES_PORT: "5432"
      POSTGRES_USER: finora
      POSTGRES_PASSWORD: password
      POSTGRES_DB: finance_db
      POSTGRES_SSLMODE: disable

    steps:
      # ====================================================
      # CHECKOUT
      # ====================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ====================================================
      # VERIFY DOCKER
      # ====================================================

      - name: Verify Docker environment
        run: |
          docker --version
          docker compose version
          docker info

      # ====================================================
      # VERIFY POSTGRESQL SERVICE
      # ====================================================

      - name: Verify PostgreSQL service
        run: |
          echo "Waiting for PostgreSQL service..."

          for attempt in {1..30}; do
            if pg_isready \
              -h localhost \
              -p 5432 \
              -U finora \
              -d finance_db; then
              echo "PostgreSQL service is ready."
              exit 0
            fi

            echo "PostgreSQL not ready."
            echo "Retry ${attempt}/30..."
            sleep 2
          done

          echo "::error::PostgreSQL service did not become ready."
          exit 1

      # ====================================================
      # VERIFY DOCKER FILES
      # ====================================================

      - name: Verify Docker project
        run: |
          test -f compose.yml
          test -f backend/Dockerfile
          test -f infrastructure/web/Dockerfile
          test -f infrastructure/web/nginx.conf
          test -f scripts/docker.sh

      # ====================================================
      # CONFIGURE HOST GATEWAY
      # ====================================================
      #
      # Docker containers on the Linux GitHub runner use
      # host.docker.internal to reach the PostgreSQL service
      # exposed on the runner host.
      #
      # ====================================================

      - name: Configure Docker host gateway
        run: |
          docker network create finora_ci_network 2>/dev/null || true

          echo "Docker host gateway:"
          getent hosts host.docker.internal || true

      # ====================================================
      # RUN CANONICAL DOCKER VALIDATION
      # ====================================================
      #
      # scripts/docker.sh:
      #
      #   - creates disposable .env files
      #   - validates Compose
      #   - validates architecture
      #   - builds backend/frontend images
      #   - starts the stack
      #   - waits for backend/web health
      #   - validates application endpoints
      #   - validates Vite API configuration
      #   - validates Docker healthchecks
      #   - cleans disposable environment files
      #
      # ====================================================

      - name: Validate Docker stack
        run: |
          chmod +x scripts/docker.sh
          ./scripts/docker.sh

      # ====================================================
      # FAILURE DIAGNOSTICS
      # ====================================================

      - name: Collect Docker diagnostics
        if: failure()
        run: |
          echo "============================================================"
          echo " Docker Compose Status"
          echo "============================================================"

          docker compose ps || true

          echo ""
          echo "============================================================"
          echo " Docker Images"
          echo "============================================================"

          docker images \
            --format "table {{.Repository}}\t{{.Tag}}\t{{.Size}}" || true

          echo ""
          echo "============================================================"
          echo " Docker Networks"
          echo "============================================================"

          docker network ls || true

          echo ""
          echo "============================================================"
          echo " Backend Logs"
          echo "============================================================"

          docker logs --tail 150 finora-backend 2>&1 || true

          echo ""
          echo "============================================================"
          echo " Web Logs"
          echo "============================================================"

          docker logs --tail 150 finora-web 2>&1 || true

      # ====================================================
      # CLEANUP
      # ====================================================
      #
      # Always clean the Compose stack.
      #
      # The PostgreSQL service itself is managed automatically
      # by GitHub Actions and disappears with the job.
      #
      # ====================================================

      - name: Cleanup Docker stack
        if: always()
        run: |
          docker compose down --volumes --remove-orphans || true
          docker network rm finora_ci_network 2>/dev/null || true

# ==========================================================
# END
# ==========================================================
