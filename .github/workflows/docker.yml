# ==========================================================
# Finora - Docker Stack Validation
#
# Validates the Dockerized application against the real
# Neon PostgreSQL service.
#
# Architecture:
#
#   GitHub Actions Runner
#          |
#          +---- Docker build
#          |
#          +---- Finora Backend :8000
#          |          |
#          |          +---- Neon PostgreSQL (SSL)
#          |
#          +---- Finora Web :80
#
# The actual validation logic lives in:
#
#   scripts/docker.sh
#
# This workflow only provides:
#   - clean Ubuntu runner
#   - Docker
#   - Neon credentials
#   - execution of docker.sh
#
# IMPORTANT:
#   - No PostgreSQL service is created here.
#   - No local PostgreSQL container is used.
#   - Neon is the only database.
#   - Secrets are never printed.
#
# ==========================================================

name: Finora Docker Validation

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
  pull_request:
    branches:
      - main
      - develop

# Prevent duplicate Docker validations for the same branch/PR.
concurrency:
  group: docker-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docker-validation:
    name: Docker Stack + Neon Validation
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # ------------------------------------------------------
    # Runtime environment consumed by scripts/docker.sh
    # ------------------------------------------------------
    env:
      # Frontend Vite build variable.
      # The frontend calls the backend directly from the browser.
      VITE_API_URL: http://localhost:8000

      # Complete Neon PostgreSQL connection string.
      #
      # Store the complete Neon connection string as the
      # single GitHub Actions secret: NEON_DATABASE_URL
      #
      # Example format:
      #   postgresql://USER:PASSWORD@HOST:5432/DB?sslmode=require
      #
      # The value is passed to docker.sh, which creates the
      # temporary backend/.env required by the existing app.
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}

    steps:
      # ====================================================
      # 1. Checkout
      # ====================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ====================================================
      # 2. Docker environment
      # ====================================================

      - name: Verify Docker environment
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================================="
          echo " Docker Environment"
          echo "=========================================================="

          docker --version
          docker compose version

          echo
          echo "Docker daemon:"
          docker info --format \
            'Server={{.ServerVersion}} | Storage={{.Driver}} | OS={{.OperatingSystem}}'

      # ====================================================
      # 3. Validate Neon secret
      # ====================================================
      #
      # We validate presence and basic PostgreSQL URL shape
      # only. The secret value is never echoed.
      #
      # ====================================================

      - name: Validate Neon configuration
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================================="
          echo " Neon Configuration"
          echo "=========================================================="

          if [[ -z "${NEON_DATABASE_URL:-}" ]]; then
            echo "::error::GitHub Secret NEON_DATABASE_URL is missing."
            echo "Add the complete Neon PostgreSQL connection string under:"
            echo "Repository Settings → Secrets and variables → Actions"
            exit 1
          fi

          # Basic format validation without printing the secret.
          if [[ "${NEON_DATABASE_URL}" != postgresql://* &&                 "${NEON_DATABASE_URL}" != postgres://* ]]; then
            echo "::error::NEON_DATABASE_URL is not a valid PostgreSQL connection string."
            exit 1
          fi

          # Neon connections must use SSL.
          if [[ "${NEON_DATABASE_URL}" != *"sslmode=require"* ]]; then
            echo "::error::NEON_DATABASE_URL must include sslmode=require."
            echo "Use the connection string supplied by Neon."
            exit 1
          fi

          echo "✓ NEON_DATABASE_URL is configured."
          echo "✓ PostgreSQL connection string format is valid."
          echo "✓ Neon SSL mode is configured."

      # ====================================================
      # 4. Validate Docker project files
      # ====================================================

      - name: Validate Docker project structure
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================================="
          echo " Docker Project Structure"
          echo "=========================================================="

          required_files=(
            "compose.yml"
            "scripts/docker.sh"
            "backend/Dockerfile"
            "infrastructure/web/Dockerfile"
            "infrastructure/web/nginx.conf"
            "frontend/package.json"
          )

          for file in "${required_files[@]}"; do
            if [[ ! -f "${file}" ]]; then
              echo "::error::Missing required file: ${file}"
              exit 1
            fi

            echo "✓ ${file}"
          done

          if [[ ! -x "scripts/docker.sh" ]]; then
            chmod +x scripts/docker.sh
          fi

          echo
          echo "✓ Docker project structure is valid."

      # ====================================================
      # 5. Validate Compose definition
      # ====================================================
      #
      # This is intentionally done before docker.sh as a
      # cheap early failure check.
      #
      # The workflow must never contain a PostgreSQL service.
      #
      # ====================================================

      - name: Validate Compose architecture
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================================="
          echo " Compose Architecture"
          echo "=========================================================="

          docker compose -f compose.yml config --quiet

          services="$(docker compose -f compose.yml config --services)"

          echo
          echo "Services:"
          echo "${services}"

          if echo "${services}" | grep -qx "postgres"; then
            echo "::error::PostgreSQL service must not exist in compose.yml."
            echo "Finora uses Neon PostgreSQL externally."
            exit 1
          fi

          if ! echo "${services}" | grep -qx "backend"; then
            echo "::error::backend service is missing from compose.yml."
            exit 1
          fi

          if ! echo "${services}" | grep -qx "web"; then
            echo "::error::web service is missing from compose.yml."
            exit 1
          fi

          echo
          echo "✓ Compose contains backend + web only."
          echo "✓ No local PostgreSQL service."

      # ====================================================
      # 6. Run the complete Docker validation
      # ====================================================
      #
      # docker.sh owns:
      #   - image builds
      #   - container startup
      #   - health checks
      #   - backend API test
      #   - Neon SQL connectivity
      #   - frontend validation
      #   - Vite API configuration validation
      #   - final stack validation
      #
      # ====================================================

      - name: Run Docker stack validation
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================================="
          echo " Starting Finora Docker Stack Validation"
          echo "=========================================================="

          chmod +x scripts/docker.sh

          ./scripts/docker.sh

      # ====================================================
      # 7. Failure diagnostics
      # ====================================================
      #
      # docker.sh already prints detailed diagnostics.
      # This step provides an additional Compose-level view
      # if a failure occurs before cleanup.
      #
      # ====================================================

      - name: Collect Docker diagnostics on failure
        if: failure()
        shell: bash
        run: |
          set +e

          echo
          echo "=========================================================="
          echo " Docker Failure Diagnostics"
          echo "=========================================================="

          echo
          echo "--- Compose status ---"
          docker compose -f compose.yml ps

          echo
          echo "--- Docker containers ---"
          docker ps -a \
            --filter "name=finora-backend" \
            --filter "name=finora-web"

          echo
          echo "--- Backend logs ---"
          docker logs finora-backend --tail 250 2>&1 || true

          echo
          echo "--- Backend health ---"
          docker inspect finora-backend \
            --format '{{range .State.Health.Log}}{{println "exit=" .ExitCode}}{{println .Output}}{{end}}' \
            2>&1 || true

          echo
          echo "--- Web logs ---"
          docker logs finora-web --tail 250 2>&1 || true

          echo
          echo "--- Web health ---"
          docker inspect finora-web \
            --format '{{range .State.Health.Log}}{{println "exit=" .ExitCode}}{{println .Output}}{{end}}' \
            2>&1 || true

          echo
          echo "--- Docker images ---"
          docker images --format \
            'table {{.Repository}}\t{{.Tag}}\t{{.Size}}\t{{.CreatedSince}}'

      # ====================================================
      # 8. Final cleanup
      # ====================================================

      - name: Cleanup Docker stack
        if: always()
        shell: bash
        run: |
          set +e

          echo "=========================================================="
          echo " Cleaning Docker Validation Resources"
          echo "=========================================================="

          docker compose \
            -f compose.yml \
            down --remove-orphans

          echo
          echo "✓ Docker validation resources cleaned up."
