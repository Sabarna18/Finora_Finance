# ============================================================
# Finora — Docker Validation
#
# Purpose:
#   Validate, build, start, migrate and smoke-test the complete
#   Docker Compose stack before Docker images are published.
# ============================================================

name: Docker Validation

# ============================================================
# TRIGGERS
# ============================================================

on:
  push:
    branches:
      - main
      - master
      - "feature/**"

    paths:
      - "backend/**"
      - "frontend/**"
      - "infrastructure/**"
      - "compose.yaml"
      - "compose.yml"
      - "docker-compose.yml"
      - "scripts/docker.sh"
      - ".dockerignore"
      - ".github/workflows/docker.yml"

  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "infrastructure/**"
      - "compose.yaml"
      - "compose.yml"
      - "docker-compose.yml"
      - "scripts/docker.sh"
      - ".dockerignore"
      - ".github/workflows/docker.yml"

  workflow_dispatch:

# ============================================================
# PERMISSIONS
# ============================================================

permissions:
  contents: read

# ============================================================
# CONCURRENCY
# ============================================================

concurrency:
  group: docker-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ============================================================
# JOB
# ============================================================

jobs:
  validate-docker:
    name: Validate Docker Stack

    runs-on: ubuntu-latest

    # ========================================================
    # ENVIRONMENT
    # ========================================================

    env:
      COMPOSE_PROJECT_NAME: finora-ci

      COMPOSE_FILE: compose.yml

      DATABASE_SERVICE: postgres
      BACKEND_SERVICE: backend
      WEB_SERVICE: web

      BACKEND_PORT: 8000
      WEB_PORT: 80

      HEALTH_PATH: /api/v1/health

      CI_ENV_FILE: backend/.env

    steps:
      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ======================================================
      # DOCKER VERSION
      # ======================================================

      - name: Check Docker
        run: |
          docker --version
          docker compose version

      # ======================================================
      # CREATE TEMPORARY CI ENVIRONMENT
      #
      # Required because compose.yml references:
      #
      #   backend/.env
      #
      # The file is generated only for this CI run and is
      # deleted during final cleanup.
      # ======================================================

      - name: Create temporary CI environment
        run: |
          echo "Creating temporary CI environment..."

          mkdir -p "$(dirname "${CI_ENV_FILE}")"

          cat > "${CI_ENV_FILE}" <<'EOF'
          # ============================================================
          # Finora CI Docker Validation Environment
          #
          # Generated automatically by GitHub Actions.
          # DO NOT COMMIT THIS FILE.
          # ============================================================

          # ------------------------------------------------------------
          # Application
          # ------------------------------------------------------------

          ENVIRONMENT=testing
          APP_ENV=testing

          # ------------------------------------------------------------
          # Security
          # ------------------------------------------------------------

          SECRET_KEY=finora-ci-validation-secret
          JWT_SECRET_KEY=finora-ci-validation-jwt-secret

          # ------------------------------------------------------------
          # PostgreSQL
          # ------------------------------------------------------------

          POSTGRES_USER=finora
          POSTGRES_PASSWORD=finora
          POSTGRES_DB=finora

          # ------------------------------------------------------------
          # Database
          # ------------------------------------------------------------

          DATABASE_URL=postgresql+psycopg://finora:finora@postgres:5432/finora

          # ------------------------------------------------------------
          # CORS
          # ------------------------------------------------------------

          CORS_ORIGINS=["http://localhost:80","http://localhost:5173"]

          # ------------------------------------------------------------
          # Frontend
          # ------------------------------------------------------------

          VITE_API_URL=http://localhost:8000/api/v1
          EOF

          test -f "${CI_ENV_FILE}"

          echo "Temporary CI environment created."

      # ======================================================
      # VALIDATE DOCKER SCRIPT
      # ======================================================

      - name: Validate Docker script
        run: |
          test -f scripts/docker.sh

          chmod +x scripts/docker.sh

          bash -n scripts/docker.sh

      # ======================================================
      # VALIDATE COMPOSE CONFIGURATION
      # ======================================================

      - name: Validate Compose configuration
        run: |
          docker compose \
            -f "${COMPOSE_FILE}" \
            config --quiet

      # ======================================================
      # VERIFY REQUIRED SERVICES
      # ======================================================

      - name: Verify Docker services
        run: |
          echo "Configured Docker services:"

          docker compose \
            -f "${COMPOSE_FILE}" \
            config --services

          echo

          services="$(
            docker compose \
              -f "${COMPOSE_FILE}" \
              config --services
          )"

          for service in \
            "${DATABASE_SERVICE}" \
            "${BACKEND_SERVICE}" \
            "${WEB_SERVICE}"
          do
            if ! grep -qx "${service}" <<< "${services}"; then
              echo "::error::Required Compose service is missing: ${service}"
              exit 1
            fi
          done

          echo
          echo "All required Docker services are present."

      # ======================================================
      # BUILD + RUN + MIGRATE + HEALTH CHECK
      #
      # scripts/docker.sh owns the actual Docker validation.
      # ======================================================

      - name: Validate complete Docker stack
        run: |
          ./scripts/docker.sh

      # ======================================================
      # FAILURE DIAGNOSTICS
      # ======================================================

      - name: Collect Docker diagnostics
        if: failure()
        run: |

          echo "=============================================="
          echo "Docker containers"
          echo "=============================================="

          docker ps -a || true


          echo
          echo "=============================================="
          echo "Compose status"
          echo "=============================================="

          docker compose \
            -f "${COMPOSE_FILE}" \
            ps || true


          echo
          echo "=============================================="
          echo "Compose logs"
          echo "=============================================="

          docker compose \
            -f "${COMPOSE_FILE}" \
            logs \
            --no-color \
            --tail=200 \
            || true

      # ======================================================
      # FINAL CLEANUP
      # ======================================================

      - name: Docker cleanup
        if: always()
        run: |

          echo "=============================================="
          echo "Docker cleanup"
          echo "=============================================="

          docker compose \
            -f "${COMPOSE_FILE}" \
            down \
            --volumes \
            --remove-orphans \
            || true


          echo
          echo "Removing temporary CI environment..."

          rm -f "${CI_ENV_FILE}" || true


          echo
          echo "Docker cleanup completed."
