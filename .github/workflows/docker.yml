# ==========================================================
# Finora - Release
#
# Trigger:
#   git tag v1.0.0
#   git push origin v1.0.0
#
# Flow:
#   tag -> release.sh -> compose build -> compose up
#       -> validate -> publish exact images to GHCR
#
# Deployment is NOT performed here.
# A later deploy workflow consumes the immutable version tag
# for VPS simulation, Render, and Vercel.
# ==========================================================

name: Finora Release

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: finora-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  release:
    name: Validate and Publish GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # Browser-facing backend origin for the local release
      # validation build. client.ts owns /api/v1.
      VITE_API_URL: http://localhost:8000

      # Single database secret. release.sh converts it into
      # the backend/.env contract required by compose.yml.
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}

      # GitHub token is granted packages:write above.
      GHCR_USERNAME: ${{ github.actor }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GHCR_OWNER: ${{ github.repository_owner }}
      GHCR_REGISTRY: ghcr.io

    steps:
      - name: Checkout tagged release
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          TAG="${GITHUB_REF_NAME}"

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag must match vMAJOR.MINOR.PATCH."
            exit 1
          fi

          VERSION="${TAG#v}"

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

          echo "=========================================================="
          echo " Finora Release"
          echo "=========================================================="
          echo
          echo "Tag     : ${TAG}"
          echo "Version : ${VERSION}"
          echo "Commit  : ${GITHUB_SHA}"

      - name: Verify Docker environment
        shell: bash
        run: |
          set -euo pipefail
          docker --version
          docker compose version
          docker info --format 'Server={{.ServerVersion}} | OS={{.OperatingSystem}}'

      - name: Validate release secrets
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${NEON_DATABASE_URL:-}" ]]; then
            echo "::error::NEON_DATABASE_URL GitHub Secret is missing."
            exit 1
          fi

          if [[ "$NEON_DATABASE_URL" != postgres://* &&
                "$NEON_DATABASE_URL" != postgresql://* ]]; then
            echo "::error::NEON_DATABASE_URL must be a PostgreSQL URL."
            exit 1
          fi

          if [[ "$NEON_DATABASE_URL" != *"sslmode=require"* ]]; then
            echo "::error::NEON_DATABASE_URL must contain sslmode=require."
            exit 1
          fi

          echo "✓ Neon configuration is present."
          echo "✓ GHCR publishing credentials are available."

      - name: Validate release script
        shell: bash
        run: |
          set -euo pipefail
          test -f scripts/release.sh
          bash -n scripts/release.sh
          chmod +x scripts/release.sh
          echo "✓ scripts/release.sh is valid."

      - name: Build validate and publish
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          ./scripts/release.sh

      - name: Print published image references
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          echo
          echo "=========================================================="
          echo " Published GHCR Images"
          echo "=========================================================="
          echo
          echo "ghcr.io/${GHCR_OWNER}/finora-backend:${VERSION}"
          echo "ghcr.io/${GHCR_OWNER}/finora-backend:latest"
          echo "ghcr.io/${GHCR_OWNER}/finora-web:${VERSION}"
          echo "ghcr.io/${GHCR_OWNER}/finora-web:latest"
          echo
          echo "✓ Release publication complete."

      - name: Final cleanup
        if: always()
        shell: bash
        run: |
          set +e
          docker compose -f compose.yml down --remove-orphans
          rm -f .env backend/.env
          echo "✓ Release runner cleanup completed."
