# ==========================================================
# Finora - Docker Stack Validation
#
# Validates the complete Dockerized application against the
# real Neon PostgreSQL service.
#
# Database:
#   Neon PostgreSQL only
#
# GitHub Secret:
#   NEON_DATABASE_URL
#
# Environment lifecycle:
#   scripts/docker.sh creates temporary .env files because
#   compose.yml requires backend/.env.
#
# IMPORTANT:
#   - No PostgreSQL GitHub Actions service.
#   - No local PostgreSQL container.
#   - No permanent .env files.
#   - docker.sh owns Compose validation and cleanup.
#
# ==========================================================

name: Finora Docker Validation

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: docker-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docker-validation:
    name: Docker Stack + Neon Validation
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # Vite build-time backend origin.
      # client.ts owns /api/v1.
      VITE_API_URL: http://localhost:8000

      # Complete Neon PostgreSQL connection string.
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}

    steps:
      # ====================================================
      # 1. Checkout
      # ====================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ====================================================
      # 2. Verify Docker
      # ====================================================

      - name: Verify Docker environment
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================================="
          echo " Docker Environment"
          echo "=========================================================="

          docker --version
          docker compose version
          docker info --format \
            'Server={{.ServerVersion}} | Storage={{.Driver}} | OS={{.OperatingSystem}}'

          echo
          echo "✓ Docker environment ready."

      # ====================================================
      # 3. Validate Neon secret
      # ====================================================

      - name: Validate Neon configuration
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================================="
          echo " Neon Configuration"
          echo "=========================================================="

          if [[ -z "${NEON_DATABASE_URL:-}" ]]; then
            echo "::error::NEON_DATABASE_URL GitHub Secret is missing."
            exit 1
          fi

          case "${NEON_DATABASE_URL}" in
            postgresql://*|postgres://*)
              ;;
            *)
              echo "::error::NEON_DATABASE_URL must be a PostgreSQL connection string."
              exit 1
              ;;
          esac

          if [[ "${NEON_DATABASE_URL}" != *"sslmode=require"* ]]; then
            echo "::error::NEON_DATABASE_URL must contain sslmode=require."
            exit 1
          fi

          echo "✓ NEON_DATABASE_URL is configured."
          echo "✓ PostgreSQL connection string format is valid."
          echo "✓ Neon SSL is required."

      # ====================================================
      # 4. Validate Docker script
      # ====================================================

      - name: Validate Docker validation script
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================================="
          echo " Docker Validation Script"
          echo "=========================================================="

          if [[ ! -f "scripts/docker.sh" ]]; then
            echo "::error::scripts/docker.sh is missing."
            exit 1
          fi

          chmod +x scripts/docker.sh
          bash -n scripts/docker.sh

          echo "✓ scripts/docker.sh exists."
          echo "✓ Bash syntax is valid."

      # ====================================================
      # 5. Run complete Docker validation
      # ====================================================
      #
      # docker.sh is deliberately responsible for:
      #
      #   1. Creating temporary .env
      #   2. Creating temporary backend/.env
      #   3. docker compose config
      #   4. Building backend/web
      #   5. Starting containers
      #   6. Backend health
      #   7. Neon SQL connectivity
      #   8. Web health
      #   9. Frontend validation
      #  10. Cleanup
      #
      # This is important because compose.yml requires
      # backend/.env while Compose is being parsed.
      #
      # ====================================================

      - name: Run Docker stack validation
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================================="
          echo " Starting Finora Docker Stack Validation"
          echo "=========================================================="

          ./scripts/docker.sh

      # ====================================================
      # 6. Defensive cleanup
      # ====================================================
      #
      # docker.sh performs its own cleanup. This step protects
      # the runner if docker.sh itself is interrupted before
      # its EXIT trap can run.
      #
      # Do not run docker compose commands here: compose.yml
      # requires backend/.env, which docker.sh deliberately
      # removes after validation.
      #
      # ====================================================

      - name: Remove temporary environment files
        if: always()
        shell: bash
        run: |
          set +e

          rm -f .env
          rm -f backend/.env

          echo "✓ Temporary environment files removed."

      # ====================================================
      # 7. Docker diagnostics
      # ====================================================
      #
      # Only useful when containers still exist. docker.sh
      # normally cleans them after collecting its own failure
      # diagnostics.
      #
      # ====================================================

      - name: Collect remaining Docker diagnostics
        if: failure()
        shell: bash
        run: |
          set +e

          echo
          echo "=========================================================="
          echo " Remaining Docker Diagnostics"
          echo "=========================================================="

          docker ps -a \
            --filter "name=finora-backend" \
            --filter "name=finora-web"

          echo
          echo "--- Backend logs ---"
          docker logs finora-backend --tail 100 2>&1 || true

          echo
          echo "--- Web logs ---"
          docker logs finora-web --tail 100 2>&1 || true
