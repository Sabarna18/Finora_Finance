# ==========================================================
# Finora - Docker Stack Validation
#
# Purpose:
#   Run scripts/docker.sh on a clean GitHub runner.
#
# Database:
#   Real Neon PostgreSQL
#
# Secret:
#   NEON_DATABASE_URL
#
# IMPORTANT:
#   - No PostgreSQL GitHub service.
#   - No CI database.
#   - No permanent .env files.
#   - scripts/docker.sh creates and removes temporary env files.
#
# ==========================================================

name: Finora Docker Validation

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: docker-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docker-validation:
    name: Docker Stack + Neon Validation
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # Vite build-time API origin.
      # client.ts adds /api/v1.
      VITE_API_URL: http://localhost:8000

      # Complete Neon PostgreSQL connection string.
      # The secret is consumed by scripts/docker.sh.
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}

    steps:
      # ====================================================
      # 1. Checkout
      # ====================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ====================================================
      # 2. Verify Docker environment
      # ====================================================

      - name: Verify Docker environment
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================================="
          echo " Docker Environment"
          echo "=========================================================="

          docker --version
          docker compose version

          echo
          docker info --format \
            'Server={{.ServerVersion}} | Storage={{.Driver}} | OS={{.OperatingSystem}}'

      # ====================================================
      # 3. Validate Neon secret
      # ====================================================

      - name: Validate Neon secret
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================================="
          echo " Neon Configuration"
          echo "=========================================================="

          if [[ -z "${NEON_DATABASE_URL:-}" ]]; then
            echo "::error::NEON_DATABASE_URL GitHub Secret is missing."
            exit 1
          fi

          case "${NEON_DATABASE_URL}" in
            postgresql://*|postgres://*)
              ;;
            *)
              echo "::error::NEON_DATABASE_URL must be a PostgreSQL connection string."
              exit 1
              ;;
          esac

          if [[ "${NEON_DATABASE_URL}" != *"sslmode=require"* ]]; then
            echo "::error::NEON_DATABASE_URL must contain sslmode=require."
            exit 1
          fi

          echo "✓ NEON_DATABASE_URL is configured."
          echo "✓ Neon PostgreSQL URL format is valid."
          echo "✓ Neon SSL is required."

      # ====================================================
      # 4. Verify validation script
      # ====================================================

      - name: Verify Docker validation script
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================================="
          echo " Docker Validation Script"
          echo "=========================================================="

          if [[ ! -f "scripts/docker.sh" ]]; then
            echo "::error::scripts/docker.sh is missing."
            exit 1
          fi

          chmod +x scripts/docker.sh

          bash -n scripts/docker.sh

          echo "✓ scripts/docker.sh exists."
          echo "✓ scripts/docker.sh syntax is valid."
          echo "✓ scripts/docker.sh is executable."

      # ====================================================
      # 5. Run complete Docker validation
      # ====================================================
      #
      # docker.sh creates backend/.env BEFORE any Compose
      # command, keeps it alive during the complete validation,
      # and removes it during its EXIT cleanup.
      #
      # ====================================================

      - name: Run Docker stack validation
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================================="
          echo " Starting Finora Docker Stack Validation"
          echo "=========================================================="

          ./scripts/docker.sh

      # ====================================================
      # 6. Additional diagnostics on failure
      # ====================================================

      - name: Collect Docker diagnostics on failure
        if: failure()
        shell: bash
        run: |
          set +e

          echo
          echo "=========================================================="
          echo " Docker Failure Diagnostics"
          echo "=========================================================="

          echo
          echo "--- Compose status ---"
          docker compose -f compose.yml ps

          echo
          echo "--- Containers ---"
          docker ps -a \
            --filter "name=finora-backend" \
            --filter "name=finora-web"

          echo
          echo "--- Backend health history ---"
          docker inspect finora-backend \
            --format '{{range .State.Health.Log}}{{println "exit=" .ExitCode}}{{println .Output}}{{end}}' \
            2>/dev/null || true

          echo
          echo "--- Backend logs ---"
          docker logs finora-backend --tail 250 2>&1 || true

          echo
          echo "--- Web health history ---"
          docker inspect finora-web \
            --format '{{range .State.Health.Log}}{{println "exit=" .ExitCode}}{{println .Output}}{{end}}' \
            2>/dev/null || true

          echo
          echo "--- Web logs ---"
          docker logs finora-web --tail 250 2>&1 || true

      # ====================================================
      # 7. Final cleanup
      # ====================================================
      #
      # docker.sh normally performs its own cleanup. This
      # step is defensive cleanup for failures outside the
      # script itself.
      #
      # ====================================================

      - name: Cleanup Docker resources
        if: always()
        shell: bash
        run: |
          set +e

          docker compose -f compose.yml down --remove-orphans

          # Defensive removal. docker.sh also removes these.
          rm -f .env backend/.env

          echo "✓ Docker resources cleaned up."
          echo "✓ Temporary environment files removed."
