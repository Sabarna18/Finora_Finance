# ============================================================
# Finora — Docker Validation
#
# Purpose:
#   Validate the complete Finora Docker application stack
#   against a dedicated CI Neon PostgreSQL database.
#
# Architecture:
#
#   GitHub Actions
#        │
#        ▼
#   scripts/docker.sh
#        │
#        ├── Temporary environment
#        │
#        ├── Docker Compose validation
#        │
#        ├── Build backend
#        ├── Build web
#        │
#        ├── Backend
#        │      │
#        │      └──► CI Neon PostgreSQL
#        │
#        ├── Backend health
#        ├── Neon connectivity
#        ├── Web health
#        ├── Frontend smoke test
#        │
#        └── Cleanup
#
# IMPORTANT:
#
#   - No local PostgreSQL container is created.
#   - CI uses a dedicated Neon PostgreSQL database.
#   - Production Neon MUST NOT be used for CI.
#   - scripts/docker.sh owns the complete validation logic.
#   - scripts/docker.sh creates and removes temporary env files.
#
# Required GitHub secret:
#
#   FINORA_CI_DATABASE_URL
#
# Example format:
#
#   postgresql://user:password@host/db?sslmode=require
#
# ============================================================

name: Docker Validation

# ============================================================
# TRIGGERS
# ============================================================

on:
  push:
    branches:
      - main
      - master
      - "feature/**"
      - "feature-*"

  pull_request:

  workflow_dispatch:

# ============================================================
# PERMISSIONS
# ============================================================

permissions:
  contents: read

# ============================================================
# CONCURRENCY
#
# If several commits are pushed quickly to the same branch,
# cancel the older validation run and validate the newest one.
# ============================================================

concurrency:
  group: docker-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ============================================================
# JOBS
# ============================================================

jobs:
  validate-docker:
    name: Validate Docker Stack

    runs-on: ubuntu-latest

    # --------------------------------------------------------
    # Environment
    # --------------------------------------------------------

    env:
      COMPOSE_PROJECT_NAME: finora-docker-validation
      COMPOSE_FILE: compose.yml

      # Dedicated CI Neon database.
      #
      # The value is mapped to the variable expected by
      # scripts/docker.sh.
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}

    steps:
      # ======================================================
      # 1. CHECKOUT
      # ======================================================

      - name: Checkout repository

        uses: actions/checkout@v5

      # ======================================================
      # 2. VERIFY DOCKER ENVIRONMENT
      # ======================================================

      - name: Verify Docker environment

        run: |

          echo "============================================================"
          echo " Docker Environment"
          echo "============================================================"

          echo

          docker --version
          docker compose version

          echo

          if ! docker info >/dev/null 2>&1; then
            echo "::error::Docker daemon is not available."
            exit 1
          fi

          echo "Docker daemon is available."
          echo "Docker Compose is available."

      # ======================================================
      # 3. VALIDATE CI DATABASE SECRET
      #
      # Do not print the secret.
      # ======================================================

      - name: Validate CI database configuration

        run: |

          echo "============================================================"
          echo " CI Database Configuration"
          echo "============================================================"

          echo

          if [[ -z "${NEON_DATABASE_URL}" ]]; then
            echo "::error::FINORA_CI_DATABASE_URL is not configured."
            exit 1
          fi

          case "${NEON_DATABASE_URL}" in
            postgresql://*|postgres://*)
              ;;
            *)
              echo "::error::FINORA_CI_DATABASE_URL must use postgresql:// or postgres://."
              exit 1
              ;;
          esac

          if [[ "${NEON_DATABASE_URL}" != *"sslmode=require"* ]]; then
            echo "::error::CI Neon database URL must contain sslmode=require."
            exit 1
          fi

          echo "CI Neon database configuration is available."
          echo "Credentials will not be printed."

      # ======================================================
      # 4. VALIDATE DOCKER SCRIPT
      # ======================================================

      - name: Validate Docker validation script

        run: |

          echo "============================================================"
          echo " Docker Validation Script"
          echo "============================================================"

          echo

          if [[ ! -f scripts/docker.sh ]]; then
            echo "::error::scripts/docker.sh not found."
            exit 1
          fi

          chmod +x scripts/docker.sh

          bash -n scripts/docker.sh

          echo "scripts/docker.sh exists."
          echo "Shell syntax validation passed."

      # ======================================================
      # 5. VERIFY COMPOSE FILE
      # ======================================================

      - name: Verify Compose file

        run: |

          echo "============================================================"
          echo " Docker Compose"
          echo "============================================================"

          echo

          if [[ ! -f "${COMPOSE_FILE}" ]]; then
            echo "::error::Compose file not found: ${COMPOSE_FILE}"
            exit 1
          fi

          echo "Compose file: ${COMPOSE_FILE}"

      # ======================================================
      # 6. FULL DOCKER VALIDATION
      #
      # scripts/docker.sh owns:
      #
      #   - temporary .env
      #   - temporary backend/.env
      #   - Compose validation
      #   - backend build
      #   - web build
      #   - backend startup
      #   - Neon connectivity
      #   - backend health
      #   - web startup
      #   - web health
      #   - frontend smoke tests
      #   - cleanup
      #
      # This is the actual release-quality Docker gate.
      # ======================================================

      - name: Validate complete Docker stack

        run: |

          echo "============================================================"
          echo " Finora Docker Stack Validation"
          echo "============================================================"

          echo

          ./scripts/docker.sh

      # ======================================================
      # 7. FINAL STATUS
      #
      # This step executes only if the complete Docker
      # validation succeeded.
      # ======================================================

      - name: Docker validation summary

        if: success()

        run: |

          echo
          echo "============================================================"
          echo " Finora Docker Validation PASSED"
          echo "============================================================"

          echo

          echo "✓ Docker environment validated"
          echo "✓ Compose configuration validated"
          echo "✓ Temporary CI environment created"
          echo "✓ Backend image built"
          echo "✓ Web image built"
          echo "✓ Backend container validated"
          echo "✓ Neon PostgreSQL connectivity validated"
          echo "✓ Backend health validated"
          echo "✓ Web container validated"
          echo "✓ Nginx health validated"
          echo "✓ Frontend smoke test validated"
          echo "✓ Docker cleanup completed"

          echo

          echo "Finora Docker stack is ready."

      # ======================================================
      # 8. FAILURE SUMMARY
      #
      # scripts/docker.sh already performs detailed failure
      # diagnostics and cleanup.
      #
      # This step only adds a concise GitHub Actions summary.
      # ======================================================

      - name: Docker validation failure summary

        if: failure()

        run: |

          echo
          echo "============================================================"
          echo " Finora Docker Validation FAILED"
          echo "============================================================"

          echo

          echo "The Docker validation script reported a failure."
          echo
          echo "scripts/docker.sh already performs:"
          echo "  • Compose status collection"
          echo "  • Backend diagnostics"
          echo "  • Backend health diagnostics"
          echo "  • Backend logs"
          echo "  • Web diagnostics"
          echo "  • Web logs"
          echo "  • Docker cleanup"
          echo

          echo "Review the 'Validate complete Docker stack' step above"
          echo "for the detailed failure information."
