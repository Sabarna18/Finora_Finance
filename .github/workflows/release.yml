# ============================================================
# Finora — Release
# ============================================================
#
# Release trigger:
#
#   git tag v1.0.0
#   git push origin v1.0.0
#
# Release flow:
#
#   Version tag
#       ↓
#   Docker environment
#       ↓
#   Dedicated CI PostgreSQL
#       ↓
#   Full Compose validation
#       ↓
#   Backend + Web images
#       ↓
#   Frontend artifact verification
#       ↓
#   Health / smoke tests
#       ↓
#   Cleanup
#       ↓
#   Publish validated images to GHCR
#
# Production database:
#
#   Neon PostgreSQL is NOT accessed by this workflow.
#
# Production deployment:
#
#   GHCR backend image
#       ↓
#   Render
#       ↓
#   Neon PostgreSQL
#
# Frontend production API:
#
#   https://finora-backend-latest.onrender.com/api/v1
#
# IMPORTANT:
#
#   The production frontend API URL is supplied explicitly
#   to the Docker build.
#
#   scripts/docker.sh does not choose or default the API URL.
#
# ============================================================

name: Release

# ============================================================
# TRIGGERS
# ============================================================

on:
  push:
    tags:
      - "v*.*.*"

# ============================================================
# PERMISSIONS
# ============================================================

permissions:
  contents: read
  packages: write

# ============================================================
# CONCURRENCY
# ============================================================

concurrency:
  group: finora-release-${{ github.ref }}
  cancel-in-progress: false

# ============================================================
# JOBS
# ============================================================

jobs:
  # ========================================================
  # RELEASE
  # ========================================================

  release:
    name: Validate and Publish Docker Images
    runs-on: ubuntu-latest

    env:
      COMPOSE_PROJECT_NAME: finora-ci
      COMPOSE_FILE: compose.yml

      # ----------------------------------------------------
      # Frontend production API
      #
      # This value is intentionally explicit and absolute.
      # It is passed through Compose to the Vite production
      # build and becomes part of the released frontend bundle.
      # ----------------------------------------------------

      VITE_API_URL: https://finora-backend-latest.onrender.com/api/v1

    steps:
      # ====================================================
      # 1. CHECKOUT
      # ====================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ====================================================
      # 2. SET UP DOCKER BUILDX
      # ====================================================

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ====================================================
      # 3. DOCKER ENVIRONMENT
      # ====================================================

      - name: Verify Docker environment
        run: |
          echo "============================================================"
          echo " Docker Environment"
          echo "============================================================"

          docker --version
          docker compose version

          echo
          echo "Frontend API URL:"
          echo "  ${VITE_API_URL}"

      # ====================================================
      # 4. MAKE SCRIPTS EXECUTABLE
      # ====================================================

      - name: Make release scripts executable
        run: |
          echo "============================================================"
          echo " Release Scripts"
          echo "============================================================"

          chmod +x scripts/docker.sh
          chmod +x scripts/release.sh

          bash -n scripts/docker.sh
          bash -n scripts/release.sh

          echo
          echo "Release scripts are valid."

      # ====================================================
      # 5. VALIDATE CI DATABASE SECRET
      # ====================================================

      - name: Validate CI database secret
        env:
          CI_DATABASE_URL: ${{ secrets.FINORA_CI_DATABASE_URL }}
        run: |
          echo "============================================================"
          echo " CI Database Configuration"
          echo "============================================================"

          if [[ -z "${CI_DATABASE_URL}" ]]; then
            echo "::error::FINORA_CI_DATABASE_URL GitHub secret is not configured."
            exit 1
          fi

          echo "CI database secret is configured."
          echo "Database credentials will not be printed."

      # ====================================================
      # 6. FULL DOCKER VALIDATION
      # ====================================================

      - name: Validate Docker stack
        env:
          CI_DATABASE_URL: ${{ secrets.FINORA_CI_DATABASE_URL }}
        run: |
          echo "============================================================"
          echo " Finora Docker Release Gate"
          echo "============================================================"

          echo
          echo "Release frontend API:"
          echo "  ${VITE_API_URL}"

          chmod +x scripts/docker.sh
          ./scripts/docker.sh

      # ====================================================
      # 7. PUBLISH VALIDATED IMAGES TO GHCR
      # ====================================================

      - name: Publish validated images to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          echo "============================================================"
          echo " Publishing Validated Images"
          echo "============================================================"

          ./scripts/release.sh "${GITHUB_REF_NAME}"

      # ====================================================
      # 8. RELEASE SUMMARY
      # ====================================================

      - name: Release summary
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"

          echo
          echo "============================================================"
          echo " Finora Release"
          echo "============================================================"
          echo

          echo "Git tag:"
          echo "  ${GITHUB_REF_NAME}"
          echo

          echo "Repository:"
          echo "  ${GITHUB_REPOSITORY}"
          echo

          echo "Frontend production API:"
          echo "  ${VITE_API_URL}"
          echo

          echo "GHCR:"
          echo "  ghcr.io/${OWNER}/finora-backend:${VERSION}"
          echo "  ghcr.io/${OWNER}/finora-backend:latest"
          echo
          echo "  ghcr.io/${OWNER}/finora-web:${VERSION}"
          echo "  ghcr.io/${OWNER}/finora-web:latest"
          echo

          echo "Render backend:"
          echo "  Deploy the versioned backend image:"
          echo "  ghcr.io/${OWNER}/finora-backend:${VERSION}"
          echo

          echo "Neon:"
          echo "  Production Neon is configured at Render runtime."
          echo "  No Neon credentials are included in the image."
          echo

          echo "============================================================"
          echo " Release successful"
          echo "============================================================"

# ============================================================
# END
# ============================================================
