# ==========================================================
# Finora - Release
# ==========================================================
#
# Release trigger:
#
#   git tag v1.0.0
#   git push origin v1.0.0
#
# The Git release tag is the SINGLE source of truth for:
#   - release image tag
#   - APP_VERSION
#   - frontend VITE_APP_VERSION
#
# Deployment remains intentionally separate.
#
# ==========================================================

name: Finora Release

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: finora-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  release:
    name: Build Validate and Publish
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # Frontend build-time backend origin.
      # client.ts owns /api/v1.
      VITE_API_URL: http://localhost:8000

      # Git release metadata.
      RELEASE_TAG: ${{ github.ref_name }}

      # Real Neon database used only by release validation.
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}

      # GHCR.
      GHCR_REGISTRY: ghcr.io
      GHCR_OWNER: ${{ github.repository_owner }}
      GHCR_USERNAME: ${{ github.actor }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      # ====================================================
      # 1. Checkout exact tagged commit
      # ====================================================

      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ====================================================
      # 2. Resolve semantic version
      # ====================================================
    - name: Resolve release version
      id: version
      shell: bash
      run: |
        set -euo pipefail

        TAG="${GITHUB_REF_NAME}"

        if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "::error::Release tag must match vMAJOR.MINOR.PATCH."
          exit 1
        fi

        VERSION="${TAG#v}"

        echo "release_tag=${TAG}" >> "${GITHUB_OUTPUT}"
        echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
        echo "app_version=${VERSION}" >> "${GITHUB_OUTPUT}"

        echo "=========================================================="
        echo " Finora Release"
        echo "=========================================================="
        echo
        echo "Tag         : ${TAG}"
        echo "Version     : ${VERSION}"
        echo "APP_VERSION : ${VERSION}"
        echo "Commit      : ${GITHUB_SHA}"
        echo
          # ====================================================
          # 3. Verify Docker
          # ====================================================

          - name: Verify Docker environment
            shell: bash
            run: |
              set -euo pipefail

              docker --version
              docker compose version
              docker info --format \
                'Server={{.ServerVersion}} | Storage={{.Driver}} | OS={{.OperatingSystem}}'

      # ====================================================
      # 4. Validate release environment
      # ====================================================

      - name: Validate Neon release configuration
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${NEON_DATABASE_URL:-}" ]]; then
            echo "::error::NEON_DATABASE_URL GitHub Secret is missing."
            exit 1
          fi

          if [[ "${NEON_DATABASE_URL}" != postgres://* &&
                "${NEON_DATABASE_URL}" != postgresql://* ]]; then
            echo "::error::NEON_DATABASE_URL must be a PostgreSQL connection string."
            exit 1
          fi

          if [[ "${NEON_DATABASE_URL}" != *"sslmode=require"* ]]; then
            echo "::error::NEON_DATABASE_URL must contain sslmode=require."
            exit 1
          fi

          if [[ -z "${GHCR_TOKEN:-}" ]]; then
            echo "::error::GitHub token is unavailable for GHCR publishing."
            exit 1
          fi

          echo "✓ NEON_DATABASE_URL is configured"
          echo "✓ GHCR publishing token is available"
          echo "✓ APP_VERSION=${APP_VERSION}"

      # ====================================================
      # 5. Validate project structure
      # ====================================================

      - name: Validate release files
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            "compose.yml"
            "scripts/release.sh"
            "backend/Dockerfile"
            "infrastructure/web/Dockerfile"
            "infrastructure/web/nginx.conf"
            "frontend/package.json"
          )

          for file in "${required_files[@]}"; do
            if [[ ! -f "${file}" ]]; then
              echo "::error::Missing required file: ${file}"
              exit 1
            fi
          done

          chmod +x scripts/release.sh
          bash -n scripts/release.sh

          echo "✓ Release project structure is valid"
          echo "✓ release.sh syntax is valid"

      # ====================================================
      # 6. Run release
      # ====================================================

      - name: Build validate and publish
        shell: bash
        run: |
          set -euo pipefail

          # Pass the exact Git release tag explicitly.
          # release.sh derives VERSION/APP_VERSION from it.
          ./scripts/release.sh "${GITHUB_REF_NAME}"

      # ====================================================
      # 7. Final cleanup
      # ====================================================

      - name: Cleanup release runner
        if: always()
        shell: bash
        run: |
          set +e

          docker compose \
            -f compose.yml \
            down --remove-orphans

          rm -f \
            .env \
            backend/.env

          echo "✓ Release runner cleanup completed."

# ==========================================================
# END
# ==========================================================
