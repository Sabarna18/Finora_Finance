# ============================================================
# Finora — Release
# ============================================================
#
# Release trigger:
#
#   git tag v1.0.0
#   git push origin v1.0.0
#
# Release flow:
#
#   Git version tag
#       ↓
#   Extract version (1.0.0)
#       ↓
#   Inject VITE_APP_VERSION into Docker build
#       ↓
#   Inject production VITE_API_URL
#       ↓
#   Full Docker validation
#       ↓
#   Verify frontend bundle contains version + API URL
#       ↓
#   Publish validated images to GHCR
#
# IMPORTANT:
#
#   The Git tag is the single source of truth for the application
#   version.
#
#   v1.0.0 → VITE_APP_VERSION=1.0.0
#
#   VITE_APP_VERSION is a Vite build-time environment variable.
#   It is passed through the Docker build and embedded into the
#   frontend bundle.
#
# ============================================================

name: Release

# ============================================================
# TRIGGERS
# ============================================================

on:
  push:
    tags:
      - "v*.*.*"

# ============================================================
# PERMISSIONS
# ============================================================

permissions:
  contents: read
  packages: write

# ============================================================
# CONCURRENCY
# ============================================================

concurrency:
  group: finora-release-${{ github.ref }}
  cancel-in-progress: false

# ============================================================
# JOBS
# ============================================================

jobs:

  # ========================================================
  # RELEASE
  # ========================================================

  release:
    name: Validate and Publish Docker Images
    runs-on: ubuntu-latest

    # ======================================================
    # RELEASE ENVIRONMENT
    # ======================================================
    #
    # VITE_API_URL:
    #   Production Render backend.
    #
    # VITE_APP_VERSION:
    #   Derived automatically from the Git tag.
    #
    # Example:
    #
    #   Git tag:
    #       v1.0.0
    #
    #   becomes:
    #       VITE_APP_VERSION=1.0.0
    #
    # GitHub Actions does not allow shell expressions directly
    # inside a job-level env value, therefore VITE_APP_VERSION
    # is written to GITHUB_ENV after checkout.
    #
    env:
      COMPOSE_PROJECT_NAME: finora-ci
      COMPOSE_FILE: compose.yml

      # Production Render backend API
      VITE_API_URL: https://finora-backend-latest.onrender.com/api/v1

    steps:

      # ====================================================
      # 1. CHECKOUT
      # ====================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ====================================================
      # 2. EXTRACT RELEASE VERSION
      # ====================================================
      #
      # GitHub:
      #
      #   refs/tags/v1.0.0
      #
      # GITHUB_REF_NAME:
      #
      #   v1.0.0
      #
      # Strip "v":
      #
      #   1.0.0
      #
      # Then expose it as:
      #
      #   VITE_APP_VERSION
      #
      # which is inherited by all subsequent steps.
      #
      # ====================================================

      - name: Extract release version
        run: |
          echo "============================================================"
          echo " Release Version"
          echo "============================================================"

          VERSION="${GITHUB_REF_NAME#v}"

          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid release version: ${VERSION}"
            echo "::error::Expected semantic version such as 1.0.0"
            exit 1
          fi

          echo "Git tag:"
          echo "  ${GITHUB_REF_NAME}"

          echo
          echo "Application version:"
          echo "  ${VERSION}"

          # Make the version available to every subsequent step.
          echo "VITE_APP_VERSION=${VERSION}" >> "${GITHUB_ENV}"

          echo
          echo "VITE_APP_VERSION exported to GitHub Actions."

      # ====================================================
      # 3. SET UP DOCKER BUILDX
      # ====================================================

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ====================================================
      # 4. DOCKER ENVIRONMENT
      # ====================================================

      - name: Verify Docker environment
        run: |
          echo "============================================================"
          echo " Docker Environment"
          echo "============================================================"

          docker --version
          docker compose version

          echo
          echo "Frontend production API:"
          echo "  ${VITE_API_URL}"

          echo
          echo "Frontend application version:"
          echo "  ${VITE_APP_VERSION}"

      # ====================================================
      # 5. MAKE SCRIPTS EXECUTABLE
      # ====================================================

      - name: Make release scripts executable
        run: |
          echo "============================================================"
          echo " Release Scripts"
          echo "============================================================"

          chmod +x scripts/docker.sh
          chmod +x scripts/release.sh

          bash -n scripts/docker.sh
          bash -n scripts/release.sh

          echo
          echo "Release scripts are valid."

      # ====================================================
      # 6. VALIDATE CI DATABASE SECRET
      # ====================================================

      - name: Validate CI database secret
        env:
          CI_DATABASE_URL: ${{ secrets.FINORA_CI_DATABASE_URL }}
        run: |
          echo "============================================================"
          echo " CI Database Configuration"
          echo "============================================================"

          if [[ -z "${CI_DATABASE_URL}" ]]; then
            echo "::error::FINORA_CI_DATABASE_URL GitHub secret is not configured."
            exit 1
          fi

          echo "CI database secret is configured."
          echo "Database credentials will not be printed."

      # ====================================================
      # 7. FULL DOCKER VALIDATION
      # ====================================================

      - name: Validate Docker stack
        env:
          CI_DATABASE_URL: ${{ secrets.FINORA_CI_DATABASE_URL }}
        run: |
          echo "============================================================"
          echo " Finora Docker Release Gate"
          echo "============================================================"
          echo

          echo "Release frontend API:"
          echo "  ${VITE_API_URL}"

          echo
          echo "Release frontend version:"
          echo "  ${VITE_APP_VERSION}"

          echo

          # Both VITE values are inherited automatically:
          #
          #   VITE_API_URL
          #   VITE_APP_VERSION
          #
          # docker.sh passes them into the Compose build.
          ./scripts/docker.sh

      # ====================================================
      # 8. PUBLISH VALIDATED IMAGES TO GHCR
      # ====================================================

      - name: Publish validated images to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          echo "============================================================"
          echo " Publishing Validated Images"
          echo "============================================================"

          ./scripts/release.sh "${GITHUB_REF_NAME}"

      # ====================================================
      # 9. RELEASE SUMMARY
      # ====================================================

      - name: Release summary
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"

          echo
          echo "============================================================"
          echo " Finora Release"
          echo "============================================================"
          echo

          echo "Git tag:"
          echo "  ${GITHUB_REF_NAME}"
          echo

          echo "Application version:"
          echo "  ${VITE_APP_VERSION}"
          echo

          echo "Repository:"
          echo "  ${GITHUB_REPOSITORY}"
          echo

          echo "Frontend production API:"
          echo "  ${VITE_API_URL}"
          echo

          echo "GHCR:"
          echo "  ghcr.io/${OWNER}/finora-backend:${VERSION}"
          echo "  ghcr.io/${OWNER}/finora-backend:latest"
          echo
          echo "  ghcr.io/${OWNER}/finora-web:${VERSION}"
          echo "  ghcr.io/${OWNER}/finora-web:latest"
          echo

          echo "Render backend:"
          echo "  Deploy the versioned backend image:"
          echo "  ghcr.io/${OWNER}/finora-backend:${VERSION}"
          echo

          echo "Neon:"
          echo "  Production Neon is configured at Render runtime."
          echo "  No Neon credentials are included in the image."
          echo

          echo "Frontend build values:"
          echo "  VITE_API_URL=${VITE_API_URL}"
          echo "  VITE_APP_VERSION=${VITE_APP_VERSION}"
          echo

          echo "============================================================"
          echo " Release successful"
          echo "============================================================"
